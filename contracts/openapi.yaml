openapi: 3.1.0
info:
  title: Lunar Site Explorer API
  version: 1.0.0
  description: |
    Контракт API між бекендом (Flask) і фронтендом, а також для майбутніх джерел даних.
    Людиночитний опис, домовленості та приклади — docs/CONTRACTS.md. Математика — docs/MATH.md.

    Статус кожної операції — у полі `x-status`:
      - implemented — працює зараз;
      - planned — контракт зафіксовано, сервер поки відповідає 501 `not_implemented`.

    Домовленості (коротко):
      - кути в градусах, довжини в км (суфікс _km) або м (_m), час у годинах (_h) або секундах (_s);
      - дата й час — ISO 8601; у відповідях завжди UTC із суфіксом Z; у запиті без зони = UTC;
      - селенографічна довгота на схід; у відповідях нормалізована до [-180, 180);
      - азимут від півночі за годинниковою стрілкою, 0..360; на самому полюсі «північ» — напрямок на меридіан lon;
      - null у полях hours_to_* означає «події немає в межах вікна пошуку».
servers:
  - url: /api
tags:
  - name: service
  - name: catalog
  - name: point
  - name: period
  - name: system
  - name: planning

paths:
  /health:
    get:
      tags: [service]
      x-status: implemented
      summary: Перевірка, що сервер живий
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}

  /data/status:
    get:
      tags: [service]
      x-status: implemented
      summary: Стан підготовки даних NASA (температура, 3D-ресурси, глобус)
      description: |
        Застосунок сам готує дані у фоні (PROPOSALS П-11): кожен набір має стан `ready` (файли є),
        `running` (скрипт збирання виконується; `message` — останній рядок його виводу, відсотків не вигадуємо),
        `failed` (`message` — причина) або `missing` (не запущено). Запит, якому бракує даних, повертає 503 з тим самим
        поясненням. `auto_prepare` — чи ввімкнено автозапуск (`LSE_AUTO_PREPARE`).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DataStatus"}

  /data/prepare:
    post:
      tags: [service]
      x-status: implemented
      summary: Запустити підготовку відсутніх наборів даних у фоні
      description: |
        Без `datasets` — набори з налаштування `LSE_AUTO_PREPARE_DATASETS`. Готові й ті, що вже готуються,
        пропускаються. Відповідь повертається одразу (202): стан дивіться в `/data/status`. Якщо автопідготовку вимкнено
        (`LSE_AUTO_PREPARE=0`) — 400.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                datasets:
                  type: array
                  uniqueItems: true
                  items: {type: string, enum: [temperature, system, globe]}
      responses:
        "202":
          description: Прийнято
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DataPrepareResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /meta:
    get:
      tags: [service]
      x-status: implemented
      summary: Версії, джерела даних і ліміти сервера
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Meta"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /sites:
    get:
      tags: [catalog]
      x-status: implemented
      summary: Каталог місць посадки
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Site"}

  /sites/{site_id}:
    get:
      tags: [catalog]
      x-status: implemented
      summary: Одне місце посадки
      parameters:
        - {name: site_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Site"}
        "404": {$ref: "#/components/responses/NotFound"}

  /dsn:
    get:
      tags: [catalog]
      x-status: implemented
      summary: Станції Deep Space Network
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/DsnStation"}

  /launch-sites:
    get:
      tags: [catalog]
      x-status: implemented
      summary: Космодроми та інші місця старту
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LaunchSite"}

  /launch-systems:
    get:
      tags: [planning]
      x-status: implemented
      summary: Засоби запуску з першоджерел — системи (D6) і сучасні ракети (D7)
      description: |
        Каталог D6 (`app/data/launch_systems.json`) у стислому вигляді: спосіб старту, місткість на НОО
        (`null`, якщо в джерелах її немає — наприклад, лише ГПО), висота скидання для повітряного старту,
        місця старту. Ціни й імовірності відмови в каталозі немає; для них `/mission` використовує тимчасові
        значення і прямо перелічує їх у `provisional_fields`. Повні цитати й джерела — у файлі даних.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LaunchSystem"}

  /metrics:
    get:
      tags: [point]
      x-status: implemented
      summary: Метрики точки на Місяці в один момент (оверлей)
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
        - $ref: "#/components/parameters/datetime"
        - $ref: "#/components/parameters/height"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SiteMetrics"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /compare:
    get:
      tags: [point]
      x-status: implemented
      summary: Метрики кількох місць каталогу на одну дату
      parameters:
        - name: site
          in: query
          required: true
          description: id місця; повторити параметр 2+ рази
          schema: {type: array, items: {type: string}, minItems: 2}
          style: form
          explode: true
        - $ref: "#/components/parameters/datetime"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CompareItem"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /horizon:
    get:
      tags: [point]
      x-status: implemented
      summary: Маска горизонту точки з рельєфу LOLA (графік горизонту, 3D-вид «з поверхні», доза ГКП)
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
        - $ref: "#/components/parameters/height"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HorizonMask"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /terrain:
    get:
      tags: [point]
      x-status: implemented
      summary: Ділянка рельєфу навколо точки з DEM LOLA — поверхня для виду «з поверхні»
      description: |
        Квадратна сітка висот `n × n` зі стороною `2·radius_km` у місцевих осях точки: рядок `i` росте на північ,
        стовпець `j` — на схід; центр сітки — сама точка (`n` непарне). На самому полюсі «північ» — напрямок на
        меридіан `lon` (grid north, docs/MATH.md, §5). Вузол (схід, північ) = точка дотичної площини, спроєктована
        на сферу 1737,4 км по радіусу; висоти — **відносно висоти самої точки** (`h − ground_height_m`, метри).
        Кривину Місяця рахує клієнт: положення вузла = (R + h)·(e, n, R)/√(e² + n² + R²) відносно центра Місяця.
        Радіус і крок за замовчуванням — за роздільністю найдетальнішого DEM у точці (20 м біля південного полюса,
        до 1,9 км у глобальному LDEM_16); без завантажених DEM — гладка сфера (`source: flat`, усі висоти 0).
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
        - name: radius_km
          in: query
          description: Половина сторони ділянки, км; за замовчуванням — за роздільністю DEM (5…60)
          schema: {type: number, minimum: 0.5, maximum: 100}
        - name: n
          in: query
          description: Вузлів на сторону (непарне); за замовчуванням — крок сітки ≈ роздільності DEM, не більше 301
          schema: {type: integer, minimum: 9, maximum: 401}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TerrainPatch"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /timeline:
    get:
      tags: [period]
      x-status: implemented
      summary: Часові ряди й підсумки за період (графіки, повзунки «години Сонця / зв'язку»)
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
        - $ref: "#/components/parameters/height"
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/end"
        - name: step_h
          in: query
          description: Крок сітки, год. Сервер може збільшити крок, щоб точок було не більше limits.max_points (див. /meta).
          schema: {type: number, minimum: 0.1, maximum: 24, default: 1}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Timeline"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /events:
    get:
      tags: [period]
      x-status: implemented
      summary: Усі сходи й заходи Сонця, Землі та станцій DSN за період (до 120 діб)
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
        - $ref: "#/components/parameters/height"
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/end"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EventList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /models:
    get:
      tags: [system]
      x-status: implemented
      summary: Маніфест 3D-моделей Сонця, Землі й Місяця — що є на сервері, джерела, ліцензії, запасний вигляд
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelsManifest"}

  /scene:
    get:
      tags: [system]
      x-status: implemented
      summary: Опис 3D-сцени на момент часу — положення, орієнтація, освітлення, маркери, вибрана точка Місяця
      description: |
        Усе, що потрібно 3D-виду, одним запитом: геоцентричні положення Сонця й Місяця (ICRF, км), матриці
        орієнтації Землі й Місяця (ICRF → ITRS / MOON_ME), напрямок світла, маркери станцій DSN на Землі й місць
        каталогу на Місяці (одиничні вектори в системі тіла, без математики широти/довготи на клієнті), вибрана точка
        з напрямками на Сонце й Землю. З параметром `launch_site` у `extras` — ракета на майданчику, траєкторія
        найкращого прямого перельоту зі старту (TLI) в момент сцени й модуль у вибраній точці (П-5, задача G9).
      parameters:
        - $ref: "#/components/parameters/datetime"
        - {name: lat, in: query, description: Широта вибраної точки на Місяці (разом із lon), schema: {type: number, minimum: -90, maximum: 90}}
        - {name: lon, in: query, description: Довгота вибраної точки на Місяці (разом із lat), schema: {type: number, minimum: -180, maximum: 360}}
        - {name: markers, in: query, description: "0 — без маркерів (легша відповідь)", schema: {type: string, enum: ["0", "1", "false", "true"], default: "1"}}
        - {name: launch_site, in: query, description: "id з /launch-sites або auto (оптимальна точка старту): додає в extras ракету, траєкторію й модуль; для auto — також трасу площини відльоту й зведення вибору", schema: {type: string}}
        - {name: criterion, in: query, description: "Для launch_site=auto: fuel — економія пального (чекати вікна з найменшим нахилом), speed — швидкість (старт одразу, переліт 3 доби)", schema: {type: string, enum: [fuel, speed], default: fuel}}
        - {name: launch_scope, in: query, description: "Для launch_site=auto: spaceports — космодроми каталогу, any — довільна точка Землі", schema: {type: string, enum: [spaceports, any], default: spaceports}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Scene"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /system:
    get:
      tags: [system]
      x-status: implemented
      summary: Стан системи Сонце–Земля–Місяць для 3D-сцени на момент часу
      parameters:
        - $ref: "#/components/parameters/datetime"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemState"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /orbits:
    get:
      tags: [system]
      x-status: implemented
      summary: Оскулюючі орбіти Місяця й Землі (ICRF, км) і справжній шлях за ±½ періоду — для 3D-виду
      parameters:
        - $ref: "#/components/parameters/datetime"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Orbits"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /temperature:
    get:
      tags: [point]
      x-status: implemented
      summary: Температура поверхні в точці за вимірюваннями LRO Diviner (на дату за місцевим часом, добова крива, полярний PRP)
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
        - $ref: "#/components/parameters/datetime"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TemperaturePoint"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /temperature/map:
    get:
      tags: [point]
      x-status: implemented
      summary: Мапа температури (Diviner) для шару глобуса — коди 0…255 у base64
      parameters:
        - name: kind
          in: query
          description: now — на дату за місцевим часом; max / min / mean — за місячну добу; prp_* та ice_depth — південний полюс
          schema: {enum: [now, max, min, mean, prp_max, prp_avg, ice_depth], default: now}
        - $ref: "#/components/parameters/datetime"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TemperatureMap"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /elevation:
    get:
      tags: [point]
      x-status: implemented
      summary: Висота поверхні в точці з найдетальнішого доступного DEM LOLA (PDS)
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Elevation"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /rank:
    post:
      tags: [planning]
      x-status: implemented
      summary: Ранжування точок за факторами й порівняння найкращої з наступною
      description: |
        Для кожної точки за період рахуються підсумки (як у /timeline) і оцінки факторів 0..1 за
        абсолютними шкалами (docs/MATH.md, §19), тож оцінка точки не залежить від того, які ще точки
        в списку. Ваги — з порядку `priorities` (ROC). Режим `weighted` — зважена сума,
        `maximin` — найгірший фактор. Точки, що не виконують `requirements`, лишаються в списку
        з `feasible: false` і йдуть після допустимих. `comparison` — найкраща проти другої.
        Фактор `temperature` потребує даних Diviner (інакше 503).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RankRequest"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RankResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /search:
    post:
      tags: [planning]
      x-status: implemented
      summary: Підбір найкращих точок у регіоні за вимогами й пріоритетами (з найкращою станцією DSN для кожної)
      description: |
        Будує сітку кандидатів у `region`, оцінює кожну тією самою формулою, що й `/rank`
        (docs/MATH.md, §19), і повертає `limit` найкращих: допустимі (виконують `min_sun_hours` /
        `min_comm_hours`) — першими. Для кожної точки вказується станція DSN з найбільшою кількістю
        годин зв'язку за період. Пошук обмежений бюджетом часу сервера: якщо його вичерпано, відповідь
        містить оцінені кандидати й `grid.truncated: true`.
        Місце старту, вартість, ризик і час польоту (`launch_site_ids`, `trajectory`, фактори
        cost / risk / flight_time) з'являться з моделлю запусків — поки запит із ними відхиляється (400).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SearchRequest"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /advice:
    post:
      tags: [planning]
      x-status: implemented
      summary: Поради й пояснення від відкритої LLM щодо готових результатів розрахунків (друга черга)
      description: |
        LLM лише інтерпретує числа, надані у `facts`; вона нічого не рахує. Усі числа у відповіді
        перевіряються на наявність у `facts` (`verified`). Вимкнено, якщо не задано LSE_LLM_BASE_URL —
        тоді 503 `unavailable` з поясненням. Виклик до LLM лише з бекенду; персональні дані не передаються.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdviceRequest"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdviceResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "501": {$ref: "#/components/responses/NotImplemented"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /mission:
    post:
      tags: [planning]
      x-status: implemented
      summary: Маса, вартість і ризик місії за розмірами трьох категорій навантаження
      description: |
        Збирає модель місії (docs/MATH.md, §20): маса навантаження (`payload`), вартість польоту
        діапазоном (`cost`) і ризик діапазоном та словесною шкалою (`risk`). Усі коефіцієнти моделі —
        **тимчасові орієнтовні значення** до задачі D4, тому відповідь завжди має `provisional: true`,
        а величини — діапазони. Безпілотна місія (`crew: 0`): життєзабезпечення й зручності дорівнюють нулю,
        ризик екіпажу — `null`. Широта старту береться з `launch_site_id` (каталог `/launch-sites`) або з
        `launch_lat`; без обох — екватор (поправка 1,0). Разом `launch_site_id` і `launch_lat` не задаються.
        Відповідь придатна як `facts.mission` для `/advice`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MissionRequest"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MissionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /launch-ranking:
    post:
      tags: [planning]
      x-status: implemented
      summary: Звідки й якою ракетою летіти до вибраної точки Місяця — рейтинг стартів
      description: |
        Для точки на Місяці й дати старту (TLI) оцінює кожну пару «майданчик × ракета × траєкторія» з каталогів
        `/launch-sites`, систем запуску (D6) і ракет (D7): Δv (перехід за зшитими конічними перерізами + добавка
        майданчика), маса на НОО, заповненість ракети, вікна на добу, тривалість, вартість запуску й ризик —
        **діапазонами**. Рейтинг за пріоритетами факторів `fuel`, `speed`, `windows`, `cost`, `risk` (ваги ROC,
        режими weighted / maximin, множина Парето — docs/MATH.md, §19, §21.7). Варіант, що не вміщується в ракету,
        лишається в списку з `fits: false` і поясненням. Ціни за кг і ймовірності відмови — тимчасові (D4), тому
        `provisional: true` і перелік у `provisional_fields`. Точка на Місяці в першій версії не впливає на
        гальмування біля Місяця (LOI на колову орбіту 100 км). Відповідь придатна як `facts.launch` для `/advice`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LaunchRankingRequest"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LaunchRankingResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /plan:
    post:
      tags: [planning]
      x-status: implemented
      summary: Повний план місії одним викликом — місце посадки, старт, ракета, траєкторія, маршрут
      description: |
        Оркеструє `/search` (місця посадки за вимогами, M23) → `/mission` (маса корисного навантаження) →
        `/launch-ranking` (майданчик, ракета, траєкторія для кожного місця) → `/mission` для лідера (повна місія).
        **Автовибір.** Лідер — оптимум серед місць, що виконують усі жорсткі вимоги; якщо таких немає
        (`hard_requirements_met: false`), то місця з найменшою кількістю порушень, із поясненням `explanation`.
        Невідомі вимоги (`unchecked`) і м'які попередження (`warnings`) лише позначаються. Сітка кандидатів і бюджет
        часу — як у `/search`. Підсумкова оцінка плану — добуток оцінки місця й оцінки запуску (у відсотках).
        `route` придатний для анімації польоту (G12). Коефіцієнти вартості й ризику тимчасові (`provisional`).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlanRequest"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlanResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /launch-window:
    get:
      tags: [planning]
      x-status: implemented
      summary: Вікно запуску — оцінка у % для кожної дати
      description: |
        Для кожної дати періоду (старт TLI о 00:00 UTC, не більше 60 діб) з майданчика `launch_site` до точки
        Місяця (`lat`, `lon`): найкращий прямий перехід за 3–5 діб і дата прибуття (docs/MATH.md, §21.5), вікна
        запуску на добу й добавка Δv майданчика (§21.2–21.4), частки часу, коли в точці посадки видно Сонце й
        Землю протягом 7 діб після прибуття (маска рельєфу LOLA, без DEM — гладка сфера). Фактори `light`,
        `fuel` (мін-макс серед дат), `comms`, `windows` (W/2); оцінка дати — ваги ROC за порядком `priorities`.
        Економна траєкторія — оцінка: прибуття через середню тривалість, Δv = найкращий прямий − економія.
      parameters:
        - {name: launch_site, in: query, required: true, schema: {type: string}, description: id з /launch-sites}
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/end"
        - name: trajectory
          in: query
          schema: {$ref: "#/components/schemas/Trajectory"}
        - name: priorities
          in: query
          description: "Фактори через кому за важливістю (перший — найважливіший); за замовчуванням light,fuel,comms,windows"
          schema: {type: string, examples: ["light,fuel,comms,windows"]}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LaunchWindow"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}

components:
  parameters:
    lat:
      name: lat
      in: query
      required: true
      description: Селенографічна широта, градуси (південь — від'ємна)
      schema: {type: number, minimum: -90, maximum: 90}
    lon:
      name: lon
      in: query
      required: true
      description: Селенографічна довгота на схід, градуси; приймається -180..360
      schema: {type: number, minimum: -180, maximum: 360}
    datetime:
      name: datetime
      in: query
      description: Момент часу ISO 8601; без зони — UTC; без параметра — поточний момент
      schema: {type: string, format: date-time}
    height:
      name: height
      in: query
      description: Висота щогли/панелі над ґрунтом, м
      schema: {type: number, minimum: 0, maximum: 1000, default: 0}
    start:
      name: start
      in: query
      required: true
      schema: {type: string, format: date-time}
    end:
      name: end
      in: query
      required: true
      description: Кінець періоду; період не довший за limits.max_period_days (/meta)
      schema: {type: string, format: date-time}

  responses:
    BadRequest:
      description: Невірні параметри
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Не знайдено
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotImplemented:
      description: Контракт зафіксовано, реалізації ще немає
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unavailable:
      description: Немає потрібних даних на сервері (наприклад, файлу ефемерид)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      required: [error, detail]
      additionalProperties: false
      properties:
        error:
          type: string
          enum: [bad_request, not_found, not_implemented, unavailable, internal]
        detail:
          type: string
          description: Пояснення українською — фронтенд показує його користувачу як є

    DatasetStatus:
      type: object
      required: [id, label, approx_download, command, state, message, elapsed_s]
      additionalProperties: false
      properties:
        id: {type: string, enum: [temperature, system, globe]}
        label: {type: string}
        approx_download: {type: string, description: "Скільки буде завантажено, для людини"}
        command: {type: string, description: Команда для ручного запуску}
        state: {type: string, enum: [ready, running, failed, missing]}
        message: {type: [string, "null"], description: "Останній рядок виводу скрипта або причина помилки"}
        elapsed_s: {type: [number, "null"]}

    DataStatus:
      type: object
      required: [auto_prepare, mode, datasets]
      additionalProperties: false
      properties:
        auto_prepare: {type: boolean}
        mode:
          type: string
          enum: [pack, light, full]
          description: |
            Режим підготовки (`LSE_AUTO_PREPARE_MODE`): `pack` — готовий пакет із GitHub Release (запасний шлях — збірка
            зі скриптів), `light` — легкий пакет, `full` — лише збірка з PDS
        datasets:
          type: array
          items: {$ref: "#/components/schemas/DatasetStatus"}

    DataPrepareResponse:
      type: object
      required: [started, status]
      additionalProperties: false
      properties:
        started: {type: array, items: {type: string}, description: Набори, підготовку яких запущено цим запитом}
        status: {$ref: "#/components/schemas/DataStatus"}

    Health:
      type: object
      required: [status]
      properties:
        status: {const: ok}

    Meta:
      type: object
      required: [api_version, ephemeris, moon_orientation, moon_radius_km, data_sources, limits]
      properties:
        api_version: {type: string, examples: ["1.0.0"]}
        ephemeris: {type: string, examples: ["JPL DE440"]}
        moon_orientation: {type: string, examples: ["IAU 2015 (Archinal et al., 2018)"]}
        moon_radius_km: {type: number, examples: [1737.4]}
        data_sources:
          type: array
          items:
            type: object
            required: [id, kind, description]
            properties:
              id: {type: string}
              kind: {type: string, enum: [ephemeris, dem, horizon_masks, illumination, temperature, sites, stations, launch_sites, other]}
              description: {type: string}
              version: {type: string}
              url: {type: string}
        limits:
          type: object
          properties:
            max_period_days: {type: number}
            max_points: {type: integer}
            event_search_hours: {type: number}
            max_event_period_days: {type: number}
            max_rank_points: {type: integer}

    LatLon:
      type: object
      required: [lat, lon]
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 360}

    Site:
      type: object
      required: [id, name, lat, lon, category, note, verified]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^[a-z0-9-]+$"}
        name: {type: string}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 360}
        category: {type: string, enum: [apollo, clps, artemis, international, custom]}
        note: {type: string}
        verified: {type: boolean, description: Координати звірено з першоджерелом}

    DsnStation:
      type: object
      required: [id, name, antenna, lat, lon, elevation_m, min_elevation_deg]
      additionalProperties: false
      properties:
        id: {type: string}
        name: {type: string}
        antenna: {type: string}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
        elevation_m: {type: number, description: Висота над еліпсоїдом WGS84}
        min_elevation_deg: {type: number, description: Мінімальний кут місця антени}

    LaunchSite:
      type: object
      required: [id, name, lat, lon, kind, verified]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^[a-z0-9-]+$"}
        name: {type: string}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
        kind: {type: string, enum: [spaceport, sea_platform, air_launch, custom]}
        country: {type: string}
        note: {type: string}
        verified: {type: boolean}

    SiteMetrics:
      type: object
      description: Відповідь /metrics. Поля додаються лише зворотно сумісно.
      required:
        - lat
        - lon
        - height_m
        - datetime
        - sun_elevation_deg
        - sun_azimuth_deg
        - sun_visible_fraction
        - earth_elevation_deg
        - earth_azimuth_deg
        - earth_visible_fraction
        - earth_visible
        - earth_distance_km
        - signal_delay_s
        - recommended_station
        - hours_to_sunset
        - hours_to_sunrise
        - hours_to_earthset
        - hours_to_earthrise
        - event_search_hours
      properties:
        lat: {type: number}
        lon: {type: number, minimum: -180, maximum: 180}
        height_m: {type: number}
        datetime: {type: string, format: date-time, description: UTC із Z}
        sun_elevation_deg: {type: number, minimum: -90, maximum: 90}
        sun_azimuth_deg: {type: number, minimum: 0, maximum: 360}
        sun_visible_fraction: {type: number, minimum: 0, maximum: 1, description: Частка диска Сонця над маскою горизонту}
        earth_elevation_deg: {type: number, minimum: -90, maximum: 90}
        earth_azimuth_deg: {type: number, minimum: 0, maximum: 360}
        earth_visible_fraction: {type: number, minimum: 0, maximum: 1}
        earth_visible: {type: boolean, description: Центр Землі над маскою горизонту}
        earth_distance_km: {type: number}
        signal_delay_s: {type: number, description: Затримка в один бік до рекомендованої станції (або центру Землі)}
        recommended_station: {type: [string, "null"], description: id станції DSN або null, якщо зв'язку немає}
        hours_to_sunset: {type: [number, "null"]}
        hours_to_sunrise: {type: [number, "null"]}
        hours_to_earthset: {type: [number, "null"]}
        hours_to_earthrise: {type: [number, "null"]}
        event_search_hours: {type: number, description: Вікно пошуку подій; null у hours_to_* = події немає в цьому вікні}
        local_solar_time_h: {type: number, minimum: 0, maximum: 24, description: "Місцевий сонячний час: 12 год — Сонце на меридіані точки"}
        sun_distance_km: {type: number}
        solar_irradiance_w_m2: {type: number, description: "S = 1361 · (1 а.о. / r)² (docs/MATH.md, §10)"}
        panel_power_vertical_w_m2: {type: number, description: Вертикальна панель 1 м² зі стеженням за Сонцем, η = 0,30, з тінню від рельєфу}
        panel_power_horizontal_w_m2: {type: number, description: Горизонтальна панель 1 м², η = 0,30}
        horizon_source: {type: string, description: "Набір DEM, з якого збудовано маску горизонту, або flat"}
        stations:
          type: array
          description: Усі станції DSN у цей момент (умови зв'язку — docs/MATH.md, §9.2)
          items:
            type: object
            required: [id, name, moon_elevation_deg, station_elevation_deg, min_elevation_deg, available]
            properties:
              id: {type: string}
              name: {type: string}
              moon_elevation_deg: {type: number, description: Місяць над горизонтом станції}
              station_elevation_deg: {type: number, description: Станція над математичним горизонтом точки на Місяці}
              min_elevation_deg: {type: number}
              available: {type: boolean, description: Станція видна з точки над маскою рельєфу й Місяць вище мінімального кута антени}

    CompareItem:
      type: object
      required: [site, metrics]
      properties:
        site: {$ref: "#/components/schemas/Site"}
        metrics: {$ref: "#/components/schemas/SiteMetrics"}

    HorizonMask:
      type: object
      required: [lat, lon, observer_height_m, azimuth_step_deg, elevations_deg, source, sky_view_fraction]
      properties:
        lat: {type: number}
        lon: {type: number}
        observer_height_m: {type: number}
        azimuth_step_deg: {type: number, exclusiveMinimum: 0, description: Азимут i-го елемента = i * step}
        elevations_deg:
          type: array
          items: {type: number, minimum: -90, maximum: 90}
          minItems: 4
        source: {type: string, description: "flat — гладка сфера; інакше id набору DEM (див. /meta)", examples: [flat, lola_20m]}
        max_distance_km: {type: number}
        sky_view_fraction: {type: number, minimum: 0, maximum: 1.2, description: Частка відкритого неба відносно півсфери}
        max_elevation_deg: {type: number, description: Найвища точка горизонту}
        gcr_dose_usv_per_day: {type: number, description: "Оцінка дози ГКП: 1369 мкЗв/добу (Chang'e 4 LND, Zhang et al. 2020) × частка відкритого неба (docs/MATH.md, §12)"}

    TerrainPatch:
      type: object
      description: Сітка висот навколо точки (див. `GET /terrain`)
      required: [lat, lon, radius_km, n, spacing_m, ground_height_m, source, resolution_m, sources, heights_b64,
                 encoding, min_height_m, max_height_m, missing_fraction]
      properties:
        lat: {type: number}
        lon: {type: number, minimum: -180, maximum: 180}
        radius_km: {type: number, description: Половина сторони ділянки}
        n: {type: integer, description: Вузлів на сторону (непарне); центр — вузол (n−1)/2}
        spacing_m: {type: number, description: Крок сітки по сходу й півночі, м}
        ground_height_m: {type: number, description: "Висота точки над сферою 1737,4 км за DEM; 0 для flat"}
        source: {type: string, description: "id DEM у центрі сітки або flat (гладка сфера)", examples: [ldem_875s_20m, flat]}
        resolution_m: {type: number, description: Роздільність цього DEM, м/піксель; 0 для flat}
        sources: {type: array, items: {type: string}, description: id усіх DEM, з яких узято вузли сітки}
        heights_b64:
          type: string
          description: "n·n значень float32 (little-endian) у base64: h(i, j) − ground_height_m, м; рядок за рядком, i — на північ, j — на схід"
        encoding: {type: string, enum: [float32-le-base64]}
        min_height_m: {type: number, description: Найнижча висота ділянки відносно точки}
        max_height_m: {type: number, description: Найвища висота ділянки відносно точки}
        missing_fraction:
          type: number
          minimum: 0
          maximum: 1
          description: Частка вузлів поза покриттям DEM; їхні висоти замінено на 0 (рівень точки)

    Track:
      type: object
      description: Значення в моменти Timeline.times (масиви однакової довжини)
      required: [azimuth_deg, elevation_deg, visible_fraction]
      properties:
        azimuth_deg: {type: array, items: {type: number}}
        elevation_deg: {type: array, items: {type: number}}
        visible_fraction: {type: array, items: {type: number, minimum: 0, maximum: 1}}

    StationTrack:
      type: object
      required: [station_id, available, moon_elevation_deg]
      properties:
        station_id: {type: string}
        available: {type: array, items: {type: boolean}}
        moon_elevation_deg: {type: array, items: {type: number}}

    PeriodSummary:
      type: object
      description: Підсумки за період у земних годинах (docs/MATH.md, §8, §10)
      required: [period_h, sun_hours, comm_hours, sun_fraction, comm_fraction, longest_night_h, longest_comm_gap_h]
      properties:
        period_h: {type: number}
        sun_hours: {type: number, description: "Σ частка диска · Δt"}
        comm_hours: {type: number, description: Години, коли доступна хоча б одна станція DSN}
        sun_fraction: {type: number, minimum: 0, maximum: 1}
        comm_fraction: {type: number, minimum: 0, maximum: 1}
        longest_night_h: {type: number}
        longest_comm_gap_h: {type: number}
        energy_wh_per_m2: {type: number, description: Вертикальна панель зі стеженням, η = 0,30}
        earth_hours: {type: number, description: Години, коли центр диска Землі над маскою горизонту (незалежно від станцій)}
        earth_fraction: {type: number, minimum: 0, maximum: 1}

    Timeline:
      type: object
      required: [lat, lon, height_m, step_h, times, sun, earth, stations, summary]
      properties:
        lat: {type: number}
        lon: {type: number}
        height_m: {type: number}
        step_h: {type: number}
        times: {type: array, items: {type: string, format: date-time}}
        sun: {$ref: "#/components/schemas/Track"}
        earth: {$ref: "#/components/schemas/Track"}
        stations: {type: array, items: {$ref: "#/components/schemas/StationTrack"}}
        summary: {$ref: "#/components/schemas/PeriodSummary"}
        horizon_source: {type: string, description: "Набір DEM, з якого збудовано маску горизонту, або flat"}

    Event:
      type: object
      required: [body, kind, datetime]
      properties:
        body: {type: string, description: "sun | earth | station:<id>", examples: [sun, earth, "station:canberra"]}
        kind: {type: string, enum: [rise, set]}
        datetime: {type: string, format: date-time}

    EventList:
      type: object
      required: [lat, lon, start, end, events]
      properties:
        lat: {type: number}
        lon: {type: number}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        events: {type: array, items: {$ref: "#/components/schemas/Event"}}

    Vector3:
      type: array
      items: {type: number}
      minItems: 3
      maxItems: 3

    SystemState:
      type: object
      description: |
        Положення тіл для 3D-сцени. Система координат — ICRF з початком у центрі Землі, км.
        Орієнтація Місяця — матриця ICRF → MOON_ME (рядки), щоб накласти текстуру й поставити точку посадки.
      required: [datetime, frame, sun_km, moon_km, moon_orientation, sub_solar_point, sub_earth_point, earth_rotation_deg]
      properties:
        datetime: {type: string, format: date-time}
        frame: {const: icrf_geocentric_km}
        sun_km: {$ref: "#/components/schemas/Vector3"}
        moon_km: {$ref: "#/components/schemas/Vector3"}
        moon_orientation:
          type: array
          description: Матриця 3×3 ICRF → MOON_ME
          items: {$ref: "#/components/schemas/Vector3"}
          minItems: 3
          maxItems: 3
        sub_solar_point: {$ref: "#/components/schemas/LatLon"}
        sub_earth_point: {$ref: "#/components/schemas/LatLon"}
        earth_rotation_deg: {type: number, description: Зоряний час Гринвіча (GAST), для повороту текстури Землі}
        earth_orientation:
          type: array
          description: |
            Матриця 3×3 ICRF → ITRS (земна система: прецесія, нутація, зоряний час).
            Щоб повернути модель Землі, застосувати транспоновану матрицю (ITRS → ICRF), як і для Місяця.
          items: {$ref: "#/components/schemas/Vector3"}
          minItems: 3
          maxItems: 3
        earth_sub_solar_point:
          $ref: "#/components/schemas/LatLon"
          description: Точка на Землі, де Сонце в зеніті (WGS84, геодезична широта)
        earth_sub_lunar_point:
          $ref: "#/components/schemas/LatLon"
          description: Точка на Землі, де Місяць у зеніті — орієнтир для вибору станції DSN
        moon_illumination:
          type: object
          description: Фаза Місяця для спостерігача в центрі Землі
          required: [fraction, phase_angle_deg]
          additionalProperties: false
          properties:
            fraction: {type: number, minimum: 0, maximum: 1, description: Частка освітленого диска}
            phase_angle_deg: {type: number, minimum: 0, maximum: 180, description: Кут Сонце–Місяць–Земля}

    OrbitTrack:
      type: object
      description: |
        Оскулююча кеплерівська орбіта з вектора стану DE440 (замкнений еліпс через поточне положення тіла)
        і справжній шлях тіла за ±½ періоду. Координати — ICRF відносно центрального тіла, км.
      required: [center, body, elements, points_km, path_km, max_deviation_km]
      additionalProperties: false
      properties:
        center: {enum: [earth, sun]}
        body: {enum: [moon, earth_moon_barycenter]}
        elements:
          type: object
          required: [a_km, e, inclination_deg, period_days, periapsis_km, apoapsis_km]
          additionalProperties: false
          properties:
            a_km: {type: number, exclusiveMinimum: 0}
            e: {type: number, minimum: 0, exclusiveMaximum: 1}
            inclination_deg: {type: number, description: Нахил до площини екліптики J2000}
            period_days: {type: number, exclusiveMinimum: 0}
            periapsis_km: {type: number}
            apoapsis_km: {type: number}
        points_km: {type: array, items: {$ref: "#/components/schemas/Vector3"}, minItems: 3}
        path_km: {type: array, items: {$ref: "#/components/schemas/Vector3"}, minItems: 2}
        max_deviation_km: {type: number, minimum: 0, description: Найбільше відхилення справжнього шляху від еліпса}

    Orbits:
      type: object
      required: [datetime, frame, moon, earth]
      additionalProperties: false
      properties:
        datetime: {type: string, format: date-time}
        frame: {const: icrf_km}
        moon: {$ref: "#/components/schemas/OrbitTrack"}
        earth: {$ref: "#/components/schemas/OrbitTrack"}

    TemperatureSource:
      type: object
      required: [name, url, reference]
      additionalProperties: false
      properties:
        name: {type: string}
        url: {type: string, format: uri}
        reference: {type: string}

    TemperaturePoint:
      type: object
      description: |
        Болометрична температура LRO Diviner (GCP, комірка 0,5°, бін місцевого часу 15 хв, вимірювання 2009–2015).
        Місцевий сонячний час: 12 год + (довгота − довгота підсонячної точки) / 15°. null — немає вимірювань.
      required: [lat, lon, datetime, local_time_h, sub_solar_lon, now_k, max_k, min_k, mean_k, diurnal, cell, prp, source]
      additionalProperties: false
      properties:
        lat: {type: number}
        lon: {type: number, minimum: -180, maximum: 180}
        datetime: {type: string, format: date-time}
        local_time_h: {type: number, minimum: 0, maximum: 24}
        sub_solar_lon: {type: number}
        now_k: {type: [number, "null"]}
        max_k: {type: [number, "null"]}
        min_k: {type: [number, "null"]}
        mean_k: {type: [number, "null"]}
        diurnal:
          type: array
          items:
            type: object
            required: [ltim_h, tbol_k]
            additionalProperties: false
            properties:
              ltim_h: {type: number}
              tbol_k: {type: [number, "null"]}
        cell:
          type: object
          required: [lat, lon, res_deg]
          properties:
            lat: {type: number}
            lon: {type: number}
            res_deg: {type: number}
        prp:
          description: Південний полюс (Diviner PRP, ~0,5 км); null — точка поза ділянкою
          oneOf:
            - type: "null"
            - type: object
              required: [avg_k, max_k, ice_depth_m, cell_m]
              additionalProperties: false
              properties:
                avg_k: {type: number}
                max_k: {type: number}
                ice_depth_m: {type: [number, "null"], description: "Глибина стабільного водяного льоду; null — нестабільний"}
                cell_m: {type: number}
        source: {$ref: "#/components/schemas/TemperatureSource"}

    TemperatureMap:
      type: object
      description: |
        Сітка кодів 0…255 (base64, рядок 0 — південь / низ полярної площини): значення = code.offset + (код − 1) · code.scale,
        код 0 — немає даних. equirectangular — довгота −180…180, широта −90…90; south_polar_stereographic — площина
        dsmap_polar.cat (x праворуч — 90° сх., y угору — 0°), сторона 2 · half_extent_m.
      required: [kind, datetime, title, units, projection, width, height, code, range, note, source, codes_b64]
      additionalProperties: false
      properties:
        kind: {enum: [now, max, min, mean, prp_max, prp_avg, ice_depth]}
        datetime: {type: string, format: date-time}
        title: {type: string}
        units: {enum: [K, m]}
        projection: {enum: [equirectangular, south_polar_stereographic]}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        half_extent_m: {type: number}
        sub_solar_lon: {type: number}
        code:
          type: object
          required: [offset, scale]
          additionalProperties: false
          properties:
            offset: {type: number}
            scale: {type: number, exclusiveMinimum: 0}
        range: {type: array, items: {type: number}, minItems: 2, maxItems: 2}
        note: {type: string}
        source: {$ref: "#/components/schemas/TemperatureSource"}
        codes_b64: {type: string}

    Elevation:
      type: object
      description: |
        Висота над опорною сферою 1737,4 км (MEAN EARTH/POLAR AXIS), білінійна інтерполяція.
        Джерело — найдетальніший доступний продукт LOLA GDR з PDS (полярні 20/80 м, глобальні 64/16 пікс./град.).
      required: [lat, lon, height_m, radius_km, source]
      additionalProperties: false
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
        height_m: {type: number}
        radius_km: {type: number}
        slope_deg: {type: number, minimum: 0, maximum: 90, description: Нахил поверхні на базі slope_baseline_m}
        aspect_deg: {type: number, minimum: 0, maximum: 360, description: "Експозиція: азимут, куди схил іде вниз (від півночі за годинниковою)"}
        slope_baseline_m: {type: number, description: "База різниць (4 кроки DEM)"}
        source:
          type: object
          required: [id, product_version, resolution_m, projection, url]
          additionalProperties: false
          properties:
            id: {type: string, examples: [ldem_875s_20m]}
            product_version: {type: string}
            resolution_m: {type: number, exclusiveMinimum: 0}
            projection: {type: string}
            url: {type: string, format: uri}

    Factor:
      type: string
      enum: [energy, comms, radiation, temperature, cost, risk, flight_time]

    Trajectory:
      type: string
      enum: [direct, low_energy]
      default: direct

    SearchRequest:
      type: object
      required: [start, end]
      additionalProperties: false
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        region:
          type: object
          additionalProperties: false
          description: Область пошуку на Місяці. Без неї — південна полярна область 80–90° пд. ш. (вся Місяць — з крупнішою сіткою, напр. grid_step_deg ≥ 5).
          properties:
            lat_min: {type: number, minimum: -90, maximum: 90, default: -90}
            lat_max: {type: number, minimum: -90, maximum: 90, default: -80}
            lon_min: {type: number, minimum: -180, maximum: 180, default: -180}
            lon_max: {type: number, minimum: -180, maximum: 180, default: 180}
        grid_step_deg: {type: number, minimum: 0.25, maximum: 30, default: 2, description: Крок сітки кандидатів по широті; по довготі — з поправкою на cos(широти)}
        max_candidates: {type: integer, minimum: 1, maximum: 400, default: 200, description: Якщо сітка більша — 400 з порадою збільшити крок або зменшити область}
        include_catalog: {type: boolean, default: false, description: Додати до кандидатів місця з каталогу}
        step_h: {type: number, minimum: 1, maximum: 24, default: 6, description: Крок часу оцінки, год (грубіший за /rank, бо кандидатів багато)}
        height_m: {type: number, minimum: 0, maximum: 1000, default: 0}
        min_sun_hours: {type: number, minimum: 0, description: Повзунок «години Сонця»}
        min_comm_hours: {type: number, minimum: 0, description: Повзунок «години зв'язку»}
        max_slope_deg: {type: number, minimum: 0, maximum: 90, description: Жорстка вимога — макс. нахил майданчика (з DEM; без DEM — «не перевірено»)}
        min_earth_fraction: {type: number, minimum: 0, maximum: 1, description: М'яка вимога — мін. частка періоду, коли видно Землю}
        min_sun_fraction: {type: number, minimum: 0, maximum: 1, description: М'яка вимога — мін. частка періоду, коли видно Сонце}
        mission_profile:
          type: string
          enum: [uncrewed, crewed]
          description: "Профіль місії (M17) — початкові пріоритети й вимоги до місця (нахил посадки < 10°, Земля ≥ 25 %, Сонце ≥ 5 % для пілотованої); явні значення переважають"
        crew: {type: integer, minimum: 0, maximum: 6, description: Лише разом із mission_profile}
        earth_target: {oneOf: [{$ref: "#/components/schemas/LatLon"}, {type: "null"}], description: Точка на Землі, куди потрібен зв'язок; поки лише повертається в ланцюжку}
        launch_site_ids: {type: array, items: {type: string}, description: Ще не підтримується (модель запусків) — 400}
        trajectory: {oneOf: [{$ref: "#/components/schemas/Trajectory"}, {type: "null"}], description: Ще не підтримується (модель запусків) — 400}
        priorities:
          type: array
          description: Від найважливішого; порядок задає ваги ROC. За замовчуванням [energy, comms].
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/RankFactor"}
        mode: {type: string, enum: [weighted, maximin], default: weighted}
        params:
          type: object
          description: Перевизначення опорних шкал (як у /rank)
          additionalProperties: {type: number}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}

    Chain:
      type: object
      description: Кандидат із оцінкою; місце старту з'явиться з моделлю запусків
      required: [rank, moon_site, dsn_station_id, dsn_hours, launch_site_id, earth_target, feasible, violations, score_pct, pareto, factors, summary, horizon_source]
      properties:
        rank: {type: integer, minimum: 1}
        moon_site:
          type: object
          required: [lat, lon]
          properties:
            site_id: {type: [string, "null"]}
            name: {type: [string, "null"]}
            lat: {type: number}
            lon: {type: number}
        dsn_station_id: {type: [string, "null"], description: Станція з найбільшою кількістю годин зв'язку за період; null — зв'язку немає}
        dsn_hours: {type: number, description: Годин, коли ця станція доступна}
        launch_site_id: {type: [string, "null"], description: Завжди null, доки немає моделі запусків}
        earth_target: {oneOf: [{$ref: "#/components/schemas/LatLon"}, {type: "null"}]}
        feasible: {type: boolean}
        violations:
          type: array
          items: {$ref: "#/components/schemas/RankViolation"}
        warnings:
          type: array
          description: Не виконані м'які вимоги (фільтри відбору); точка лишається допустимою, бал знижено
          items: {$ref: "#/components/schemas/RankWarning"}
        unchecked:
          type: array
          description: Задані вимоги, яких не вдалося перевірити (немає даних, напр. нахил без DEM) — не «виконано» і не «порушено»
          items: {type: string, enum: [max_slope_deg]}
        score_pct: {type: number, minimum: 0, maximum: 100}
        pareto: {type: boolean, description: Недомінований серед допустимих кандидатів}
        factors:
          type: object
          description: Нормалізовані оцінки 0..1 за кожним фактором
          additionalProperties: {type: number, minimum: 0, maximum: 1}
        summary: {$ref: "#/components/schemas/RankSummary"}
        horizon_source: {type: string}

    SearchResponse:
      type: object
      required: [period, mode, priorities, weights, params, grid, chains, comparison]
      properties:
        period:
          type: object
          required: [start, end, period_h, step_h]
          properties:
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
            period_h: {type: number}
            step_h: {type: number}
        mode: {type: string, enum: [weighted, maximin]}
        priorities: {type: array, items: {$ref: "#/components/schemas/RankFactor"}}
        weights:
          type: object
          additionalProperties: {type: number}
        params:
          type: object
          additionalProperties: {type: number}
        grid:
          type: object
          required: [step_deg, candidates, evaluated, truncated]
          properties:
            step_deg: {type: number}
            candidates: {type: integer, description: Скільки кандидатів у сітці}
            evaluated: {type: integer, description: Скільки встигли оцінити в межах бюджету часу}
            truncated: {type: boolean, description: true — бюджет часу вичерпано, частину кандидатів не оцінено}
            budget_s: {type: number}
        chains: {type: array, items: {$ref: "#/components/schemas/Chain"}}
        comparison:
          oneOf:
            - {$ref: "#/components/schemas/RankComparison"}
            - {type: "null"}

    LaunchWindow:
      type: object
      required: [launch_site_id, trajectory, days, best]
      properties:
        launch_site_id: {type: string}
        trajectory: {$ref: "#/components/schemas/Trajectory"}
        moon_point: {$ref: "#/components/schemas/LatLon"}
        priorities: {type: array, items: {type: string, enum: [light, fuel, comms, windows]}}
        method: {type: string, enum: [patched_conic, estimate]}
        horizon_source: {type: string, description: "Звідки маска горизонту точки посадки (як у /horizon)"}
        landed_days: {type: number, description: "Скільки діб після прибуття оцінюються світло й зв'язок"}
        days:
          type: array
          items:
            type: object
            required: [date, score_pct]
            properties:
              date: {type: string, format: date}
              score_pct: {type: number, minimum: 0, maximum: 100}
              arrival: {type: string, format: date-time}
              flight_days: {type: number}
              dv_total_m_s: {type: number, description: "Перехід (TLI + LOI) + добавка майданчика"}
              windows_per_day: {type: integer, minimum: 0, maximum: 2}
              inclination_deg: {type: number}
              sun_fraction: {type: number, minimum: 0, maximum: 1, description: "Частка часу з Сонцем над маскою після прибуття"}
              earth_fraction: {type: number, minimum: 0, maximum: 1, description: "Частка часу з Землею над маскою після прибуття"}
              sunlit_at_arrival: {type: boolean}
              factors: {type: object, additionalProperties: {type: number, minimum: 0, maximum: 1}}
        best:
          type: object
          required: [date, score_pct]
          properties:
            date: {type: string, format: date}
            score_pct: {type: number}

    AdviceRequest:
      type: object
      required: [facts]
      additionalProperties: false
      properties:
        facts:
          type: object
          description: |
            Готові результати розрахунків — єдине, що бачить модель. Рекомендовані ключі:
            site (назва, lat, lon), period (start, end), metrics (SiteMetrics), summary (PeriodSummary),
            mission (розмір категорій, маса, вартість, діапазон ризику, заповненість ракети),
            priorities (Factor[]). Невідомі ключі дозволені.
          additionalProperties: true
          minProperties: 1
        language: {type: string, enum: [uk, en], default: uk}
        audience:
          type: string
          enum: [planner, public]
          default: planner
          description: planner — стисло, з числами; public — простою мовою без жаргону
        question:
          type: [string, "null"]
          maxLength: 500
          description: Необов'язкове питання користувача до результатів

    AdviceTip:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string}
        related_metric: {type: string, description: "Поле з facts, на яке спирається порада, напр. mission.mass_leo_kg"}

    AdviceResponse:
      type: object
      required: [summary, tips, caveats, model, generated_utc, verified]
      additionalProperties: false
      properties:
        summary: {type: string}
        tips:
          type: array
          items: {$ref: "#/components/schemas/AdviceTip"}
        caveats:
          type: array
          items: {type: string}
        model: {type: string, description: Назва моделі, що згенерувала відповідь}
        generated_utc: {type: string, format: date-time}
        verified:
          type: boolean
          description: Усі числа у відповіді знайдено у facts. false — відповідь неперевірена, фронтенд показує попередження.

    RankFactor:
      type: string
      enum: [energy, comms, radiation, temperature]
      description: Фактори, які вміє оцінювати /rank (cost, risk, flight_time — з'являться з моделлю місії)

    RankPointInput:
      type: object
      additionalProperties: false
      description: Точка — або `site_id` з каталогу, або `lat` і `lon`
      properties:
        site_id: {type: string}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 360}
        name: {type: string}

    RankRequest:
      type: object
      required: [points, start, end]
      additionalProperties: false
      properties:
        points:
          type: array
          minItems: 2
          maxItems: 30
          items: {$ref: "#/components/schemas/RankPointInput"}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        step_h: {type: number, minimum: 0.1, maximum: 24, default: 1}
        height_m: {type: number, minimum: 0, maximum: 1000, default: 0}
        priorities:
          type: array
          description: Від найважливішого; порядок задає ваги ROC. За замовчуванням [energy, comms].
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/RankFactor"}
        mode: {type: string, enum: [weighted, maximin], default: weighted}
        mission_profile:
          type: string
          enum: [uncrewed, crewed]
          description: |
            Профіль місії (M17): початкові значення пріоритетів і вимог. Явні `priorities` і окремі поля
            `requirements` переважають профіль; без `mission_profile` поведінка не змінюється.
            Пороги профілю — з опублікованих джерел (`app/data/mission_thresholds.json`).
        crew:
          type: integer
          minimum: 0
          maximum: 6
          description: Кількість людей; лише разом із `mission_profile` (безпілотна — 0, пілотована — від 1).
        requirements:
          type: object
          additionalProperties: false
          description: |
            Вимоги до місця посадки. Жорсткі (не виконано — точка недопустима): `min_sun_hours`, `min_comm_hours`,
            `max_slope_deg` (нахил з DEM; без DEM — «не перевірено», див. `unchecked`). М'які (лише попередження
            й зниження бала): `min_earth_fraction`, `min_sun_fraction` — частки періоду 0…1.
          properties:
            min_sun_hours: {type: number, minimum: 0}
            min_comm_hours: {type: number, minimum: 0}
            max_slope_deg: {type: number, minimum: 0, maximum: 90, description: Жорстка вимога — макс. нахил майданчика, градуси}
            min_earth_fraction: {type: number, minimum: 0, maximum: 1, description: М'яка вимога — мін. частка періоду, коли видно Землю}
            min_sun_fraction: {type: number, minimum: 0, maximum: 1, description: М'яка вимога — мін. частка періоду, коли видно Сонце}
        params:
          type: object
          additionalProperties: false
          description: Перевизначення опорних шкал (MATH.md, §19.2)
          properties:
            night_ref_h: {type: number, exclusiveMinimum: 0, default: 354}
            comm_gap_ref_h: {type: number, exclusiveMinimum: 0, default: 336}
            energy_sun_weight: {type: number, minimum: 0, maximum: 1, default: 0.6}
            comms_time_weight: {type: number, minimum: 0, maximum: 1, default: 0.7}
            shield_ref: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.4}
            temp_min_k: {type: number, default: 233.15}
            temp_max_k: {type: number, default: 333.15}

    RankViolation:
      type: object
      required: [requirement, value, required]
      properties:
        requirement: {type: string, enum: [min_sun_hours, min_comm_hours, max_slope_deg]}
        value: {type: number}
        required: {type: number}

    RankWarning:
      type: object
      description: |
        М'яка вимога (фільтр відбору), яка не виконана: точка лишається допустимою, але бал знижено
        (множник max(0,5; значення / потрібне)).
      required: [requirement, value, required, kind]
      properties:
        requirement: {type: string, enum: [min_earth_fraction, min_sun_fraction]}
        value: {type: number, minimum: 0, maximum: 1}
        required: {type: number, minimum: 0, maximum: 1}
        kind: {type: string, enum: [screening]}

    RankSummary:
      type: object
      description: Підсумки за період (як PeriodSummary) і додаткові показники точки
      required: [sun_hours, comm_hours, sun_fraction, comm_fraction, longest_night_h, longest_comm_gap_h, energy_wh_per_m2]
      properties:
        sun_hours: {type: number}
        comm_hours: {type: number}
        sun_fraction: {type: number, minimum: 0, maximum: 1}
        comm_fraction: {type: number, minimum: 0, maximum: 1}
        longest_night_h: {type: number}
        longest_comm_gap_h: {type: number}
        energy_wh_per_m2: {type: number}
        sky_view_fraction: {type: number, description: Частка відкритого неба (доза ГКП ∝ ця частка)}
        slope_deg: {type: number, description: Нахил поверхні з DEM LOLA, градуси; лише якщо запитано max_slope_deg і DEM є}
        thermal_fraction: {type: [number, "null"], description: Частка місячної доби з температурою поверхні в діапазоні; лише якщо запитано temperature}

    RankedPoint:
      type: object
      required: [rank, point, feasible, violations, score_pct, pareto, factors, summary, horizon_source]
      properties:
        rank: {type: integer, minimum: 1}
        point:
          type: object
          required: [lat, lon]
          properties:
            site_id: {type: [string, "null"]}
            name: {type: [string, "null"]}
            lat: {type: number}
            lon: {type: number}
        feasible: {type: boolean}
        violations:
          type: array
          items: {$ref: "#/components/schemas/RankViolation"}
        warnings:
          type: array
          description: Не виконані м'які вимоги (фільтри відбору); точка лишається допустимою, бал знижено
          items: {$ref: "#/components/schemas/RankWarning"}
        unchecked:
          type: array
          description: Задані вимоги, яких не вдалося перевірити (немає даних, напр. нахил без DEM) — не «виконано» і не «порушено»
          items: {type: string, enum: [max_slope_deg]}
        score_pct: {type: number, minimum: 0, maximum: 100}
        pareto: {type: boolean, description: Недомінований серед допустимих точок}
        factors:
          type: object
          description: Оцінки 0..1 за кожним фактором із priorities
          additionalProperties: {type: number, minimum: 0, maximum: 1}
        summary: {$ref: "#/components/schemas/RankSummary"}
        horizon_source: {type: string, description: "flat або id DEM, з якого збудовано маску горизонту"}

    RankFactorComparison:
      type: object
      required: [factor, a, b, delta, winner]
      properties:
        factor: {$ref: "#/components/schemas/RankFactor"}
        a: {type: number}
        b: {type: number}
        delta: {type: number, description: a − b}
        winner: {type: string, enum: [a, b, tie]}

    RankComparison:
      type: object
      description: Порівняння точок a і b (за замовчуванням — найкраща проти другої)
      required: [a_rank, b_rank, score_delta_pct, dominance, per_factor, decisive_factor, weighted_advantage]
      properties:
        a_rank: {type: integer}
        b_rank: {type: integer}
        score_delta_pct: {type: number}
        dominance:
          type: string
          enum: [a, b, tradeoff, tie]
          description: a/b — одна точка не гірша за всіма факторами й краща хоча б за одним; tradeoff — виграш за одними факторами коштує програшу за іншими
        per_factor: {type: array, items: {$ref: "#/components/schemas/RankFactorComparison"}}
        decisive_factor: {type: [string, "null"], description: Фактор з найбільшим внеском у різницю (вага × різниця)}
        weighted_advantage: {type: number, description: "Σ вага·(a − b); > 0 — перевага a"}

    RankResponse:
      type: object
      required: [period, mode, priorities, weights, params, ranking, comparison]
      properties:
        period:
          type: object
          required: [start, end, period_h, step_h]
          properties:
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
            period_h: {type: number}
            step_h: {type: number}
        mode: {type: string, enum: [weighted, maximin]}
        priorities: {type: array, items: {$ref: "#/components/schemas/RankFactor"}}
        weights:
          type: object
          additionalProperties: {type: number}
        params:
          type: object
          additionalProperties: {type: number}
        ranking:
          type: array
          items: {$ref: "#/components/schemas/RankedPoint"}
        comparison:
          oneOf:
            - {$ref: "#/components/schemas/RankComparison"}
            - {type: "null"}
        profile:
          description: Профіль, застосований до запиту (лише якщо задано `mission_profile`)
          oneOf:
            - {$ref: "#/components/schemas/MissionProfile"}
            - {type: "null"}

    ProfileLimit:
      type: object
      required: [quantity, comparison, value, unit, kind, id]
      additionalProperties: false
      properties:
        quantity: {type: string}
        comparison: {type: [string, "null"], enum: ["<", "<=", ">", ">=", null]}
        value: {type: [number, "null"]}
        unit: {type: [string, "null"]}
        kind: {type: string, enum: [requirement, screening]}
        id: {type: string, description: "id порогу в mission_thresholds.json або override"}
        scope: {type: string}

    MissionProfile:
      type: object
      required: [profile, crew, priorities, limits, categories, from_profile]
      additionalProperties: false
      properties:
        profile: {type: string, enum: [uncrewed, crewed]}
        crew: {type: integer}
        priorities: {type: array, items: {$ref: "#/components/schemas/RankFactor"}}
        limits:
          type: object
          additionalProperties: {$ref: "#/components/schemas/ProfileLimit"}
        categories:
          type: object
          properties:
            life_support: {type: boolean}
            comfort: {type: boolean}
        from_profile:
          type: array
          items: {type: string}
          description: Значення, які задав профіль, а не користувач (для підсвічування в інтерфейсі)

    Vec3Unit:
      type: array
      items: {type: number, minimum: -1, maximum: 1}
      minItems: 3
      maxItems: 3

    Matrix3:
      type: array
      minItems: 3
      maxItems: 3
      items: {$ref: "#/components/schemas/Vector3"}

    PayloadSize:
      description: Розмір категорії навантаження — рівень або число 0…1
      oneOf:
        - {type: string, enum: [min, basic, extended, max]}
        - {type: number, minimum: 0, maximum: 1}

    LaunchSystem:
      type: object
      required: [id, name, kind, active, capacity_leo_kg, capacity_condition, drop_altitude_m, launch_site_ids,
                 price_usd_per_kg_leo, flights_total, flights_failed, failure_probability,
                 catalog, status, verified_by_flight, capacity_tli_kg, capacity_basis]
      additionalProperties: false
      properties:
        catalog:
          type: string
          enum: [launch_systems, rockets]
          description: Звідки запис — launch_systems (системи запуску D6, зокрема повітряний старт і морська платформа) або rockets (сучасні ракети D7)
        status:
          type: [string, "null"]
          enum: [active, in_testing, design_target, retired, null]
          description: Лише для ракет D7, для систем D6 — null (там є поле active)
        verified_by_flight:
          type: [boolean, "null"]
          description: Чи підтверджено польотом (проєктні цілі — false); для систем D6 null
        capacity_tli_kg: {type: [number, "null"], description: Місткість на траєкторію до Місяця, якщо є в каталозі}
        capacity_basis:
          type: [string, "null"]
          enum: [leo, tli, null]
          description: Яка місткість іде в розрахунок «Місії» — tli, якщо відома (як у ранжуванні старту), інакше leo; null — жодної
        price_usd_per_kg_leo:
          oneOf:
            - {$ref: "#/components/schemas/Range2"}
            - {type: "null"}
          description: Ціна за кг на НОО діапазоном (задача D8); null — немає в каталозі
        flights_total: {type: [integer, "null"], minimum: 0, description: Усього польотів (D8); null — немає в каталозі}
        flights_failed: {type: [integer, "null"], minimum: 0, description: З них невдалих (D8)}
        failure_probability:
          type: [number, "null"]
          description: |
            Ймовірність відмови зі статистики польотів — зважування слабкого апріорного рівня (2 % вагою 10 польотів) із записом польотів: (невдалих + 10·0,02) / (усього + 10);
            null — статистики немає (тоді `/mission` використовує тимчасове значення й називає його в `provisional_fields`)
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [spaceport, sea_platform, air_launch]}
        active: {type: [boolean, "null"], description: "null — стан не підтверджено джерелом"}
        capacity_leo_kg: {type: [number, "null"]}
        capacity_condition: {type: [string, "null"], description: Для якої орбіти й умови справедлива місткість}
        drop_altitude_m: {type: [number, "null"]}
        launch_site_ids: {type: array, items: {type: string}}

    MissionLaunchSystem:
      type: object
      required: [system, provisional_fields, rocket, fit]
      additionalProperties: false
      properties:
        system: {$ref: "#/components/schemas/LaunchSystem"}
        provisional_fields:
          type: array
          items: {type: string, enum: [price_usd_per_kg, failure_probability]}
          description: Поля ракети, яких немає в каталозі — використано тимчасові значення «типової ракети»
        rocket:
          type: object
          required: [name, capacity_leo_kg, capacity_basis, price_usd_per_kg, failure_probability]
          additionalProperties: false
          properties:
            name: {type: string}
            capacity_leo_kg:
              type: number
              description: Еквівалентна місткість на НОО; якщо в основі місткість на TLI, її переведено множником розгінного блока
            capacity_basis: {type: string, enum: [leo, tli], description: Основа місткості — leo чи tli}
            price_usd_per_kg: {$ref: "#/components/schemas/Range2"}
            failure_probability: {type: number}
        fit:
          type: object
          required: [utilization, launches, fits_single_launch, note]
          additionalProperties: false
          properties:
            utilization: {type: number}
            launches: {type: integer, minimum: 1}
            fits_single_launch: {type: boolean}
            note: {type: [string, "null"]}

    MissionRequest:
      type: object
      additionalProperties: false
      properties:
        crew: {type: integer, minimum: 0, maximum: 6, default: 0, description: "0 — безпілотна"}
        mission_profile:
          type: string
          enum: [uncrewed, crewed]
          description: |
            Профіль місії (M17): перевіряє `crew` (безпілотна — 0, пілотована — від 1) і, якщо `crew` не задано,
            підставляє значення за замовчуванням (безпілотна — 0, пілотована — мінімум ⚠️). Відповідь містить `profile`
            зі списком `from_profile`. Без профілю поведінка не змінюється.
        days: {type: number, minimum: 0, maximum: 365, default: 0, description: Тривалість перебування на Місяці, діб}
        sizes:
          type: object
          additionalProperties: false
          description: Розмір категорій; відсутня категорія — «basic»
          properties:
            equipment: {$ref: "#/components/schemas/PayloadSize"}
            life_support: {$ref: "#/components/schemas/PayloadSize"}
            comfort: {$ref: "#/components/schemas/PayloadSize"}
        trajectory: {type: string, enum: [direct, low_energy], default: direct}
        launch_site_id: {type: string, description: "id з /launch-sites; задає широту старту"}
        launch_system_id:
          type: string
          description: |
            id з /launch-systems: місткість ракети береться з каталогу замість «типової ракети». Без явних
            `launch_site_id` / `launch_lat` широта береться з першого місця старту системи (повітряний старт
            місця не має — тоді екватор). Система без місткості на НОО відхиляється (400).
        launch_lat: {type: number, minimum: -90, maximum: 90, description: Широта старту, градуси}
        longest_night_h: {type: number, minimum: 0, description: "Найдовша ніч точки, год (з /metrics); під неї підбираються акумулятори"}

    Range2:
      type: array
      minItems: 2
      maxItems: 2
      items: {type: number}
      description: "[мінімум, максимум]"

    MissionPayload:
      type: object
      required: [sizes, crew, days, masses_kg, power_w, heat_w, panel_kg, battery_kg, payload_kg, total_kg, total_range_kg]
      additionalProperties: false
      properties:
        sizes: {type: object, additionalProperties: {type: number}}
        crew: {type: integer}
        days: {type: number}
        masses_kg:
          type: object
          description: equipment, life_support, comfort, power_system, structure, margin
          additionalProperties: {type: number}
        power_w: {type: number}
        heat_w: {type: number}
        panel_kg: {type: number}
        battery_kg: {type: number}
        payload_kg: {type: number, description: Лише три категорії}
        total_kg: {type: number, description: Усе, що сідає на Місяць}
        total_range_kg: {$ref: "#/components/schemas/Range2"}

    MissionCost:
      type: object
      required: [trajectory, mass_moon_kg, mass_ratio, mass_leo_kg, site_factor, launches, utilization,
                 flight_time_days, launch_usd, payload_usd, lander_usd, total_usd]
      additionalProperties: false
      properties:
        trajectory: {type: string, enum: [direct, low_energy]}
        mass_moon_kg: {type: number}
        mass_ratio: {type: number, description: "кг на НОО на кг на Місяці (Ціолковський)"}
        mass_leo_kg: {type: number}
        site_factor: {type: number, description: Поправка на широту старту}
        launches: {type: integer, minimum: 1}
        utilization: {type: number, minimum: 0, description: "Заповненість ракети; > 1 — потрібно кілька пусків"}
        flight_time_days: {$ref: "#/components/schemas/Range2"}
        launch_usd: {$ref: "#/components/schemas/Range2"}
        payload_usd: {$ref: "#/components/schemas/Range2"}
        lander_usd: {$ref: "#/components/schemas/Range2"}
        total_usd: {$ref: "#/components/schemas/Range2"}

    MissionRisk:
      type: object
      required: [p_launch, p_transit, p_landing, p_systems, p_total, p_total_range, band, band_label, launches,
                 p_crew_loss, p_crew_loss_range, crew_band, crew_band_label]
      additionalProperties: false
      properties:
        p_launch: {type: number}
        p_transit: {type: number}
        p_landing: {type: number}
        p_systems: {type: number}
        p_total: {type: number}
        p_total_range: {$ref: "#/components/schemas/Range2"}
        band: {type: string, enum: [low, moderate, high, very_high]}
        band_label: {type: string, description: "Словесна шкала українською: низький · помірний · високий · дуже високий"}
        launches: {type: integer, minimum: 1}
        p_crew_loss: {type: [number, "null"], description: "null — безпілотна місія"}
        p_crew_loss_range:
          oneOf:
            - {$ref: "#/components/schemas/Range2"}
            - {type: "null"}
        crew_band: {type: [string, "null"], enum: [low, moderate, high, very_high, null]}
        crew_band_label: {type: [string, "null"]}

    MissionResponse:
      type: object
      required: [provisional, launch_lat, payload, cost, risk]
      additionalProperties: false
      properties:
        provisional: {type: boolean, description: "true — коефіцієнти моделі тимчасові (чекають D4)"}
        launch_lat: {type: number, description: Широта старту, з якою рахувалась вартість}
        launch_site_id: {type: [string, "null"]}
        profile:
          description: Профіль, застосований до запиту (лише якщо задано `mission_profile`)
          oneOf:
            - {$ref: "#/components/schemas/MissionProfile"}
            - {type: "null"}
        launch_system:
          description: Система запуску, з якою рахувалось (лише якщо задано `launch_system_id`)
          oneOf:
            - {$ref: "#/components/schemas/MissionLaunchSystem"}
            - {type: "null"}
        payload: {$ref: "#/components/schemas/MissionPayload"}
        cost: {$ref: "#/components/schemas/MissionCost"}
        risk: {$ref: "#/components/schemas/MissionRisk"}

    ModelAsset:
      type: object
      required: [id, body, kind, url, available, size_bytes, source, source_url, license, note]
      properties:
        id: {type: string}
        body: {type: string, enum: [sun, earth, moon]}
        kind: {type: string, enum: [gltf, texture, heightmap, slope]}
        url: {type: string, description: Адреса на цьому сервері (/assets/...)}
        available: {type: boolean, description: Файл існує в data_cache на сервері}
        size_bytes: {type: [integer, "null"]}
        source: {type: string}
        source_url: {type: string}
        license: {type: string}
        note: {type: string}

    BodyModels:
      type: object
      required: [id, name, radius_km, fallback, assets, complete]
      properties:
        id: {type: string, enum: [sun, earth, moon]}
        name: {type: string}
        radius_km: {type: number}
        flattening: {type: number, description: Стиснення еліпсоїда (Земля — WGS84); для куль відсутнє}
        fallback:
          type: object
          required: [kind, color, emissive]
          properties:
            kind: {const: sphere}
            color: {type: string, pattern: "^#[0-9a-f]{6}$"}
            emissive: {type: boolean}
        assets: {type: array, items: {$ref: "#/components/schemas/ModelAsset"}}
        complete: {type: boolean, description: Усі моделі й текстури тіла є на сервері}

    ModelsManifest:
      type: object
      required: [bodies, all_available, missing, build_commands, note]
      properties:
        bodies: {type: array, items: {$ref: "#/components/schemas/BodyModels"}}
        all_available: {type: boolean}
        missing: {type: array, items: {type: string}, description: id відсутніх файлів}
        build_commands: {type: array, items: {type: string}, description: Команди, що готують відсутні файли}
        note: {type: string}

    SceneBody:
      type: object
      required: [id, name, radius_km, flattening, position_km, orientation, rotation_deg, unit_to_sun, fallback, models]
      properties:
        id: {type: string, enum: [sun, earth, moon]}
        name: {type: string}
        radius_km: {type: number}
        flattening: {type: number}
        position_km: {$ref: "#/components/schemas/Vector3"}
        orientation:
          oneOf:
            - {$ref: "#/components/schemas/Matrix3"}
            - {type: "null"}
          description: Матриця ICRF → система тіла; null — немає (Сонце)
        rotation_deg: {type: [number, "null"], description: Зоряний час Гринвіча для Землі, градуси}
        unit_to_sun:
          oneOf:
            - {$ref: "#/components/schemas/Vec3Unit"}
            - {type: "null"}
          description: Одиничний вектор від тіла на Сонце (ICRF); null для самого Сонця
        fallback: {$ref: "#/components/schemas/BodyModels/properties/fallback"}
        models: {$ref: "#/components/schemas/BodyModels"}

    SceneMarkerEarth:
      type: object
      required: [id, name, lat, lon, unit_itrs]
      properties:
        id: {type: string}
        name: {type: string}
        lat: {type: number}
        lon: {type: number}
        unit_itrs: {$ref: "#/components/schemas/Vec3Unit"}

    SceneMarkerMoon:
      type: object
      required: [id, name, lat, lon, category, unit_me]
      properties:
        id: {type: string}
        name: {type: string}
        lat: {type: number}
        lon: {type: number}
        category: {type: string}
        unit_me: {$ref: "#/components/schemas/Vec3Unit"}

    SceneSelected:
      type: object
      description: Вибрана точка на Місяці (гладка сфера); кути рельєфу — у /metrics і /horizon
      required: [lat, lon, unit_me, sun_direction_me, sun_elevation_deg, sun_azimuth_deg, sun_enu, earth_direction_me, earth_elevation_deg, earth_azimuth_deg, earth_enu]
      properties:
        lat: {type: number}
        lon: {type: number}
        unit_me: {$ref: "#/components/schemas/Vec3Unit"}
        sun_direction_me: {$ref: "#/components/schemas/Vec3Unit"}
        sun_elevation_deg: {type: number}
        sun_azimuth_deg: {type: number}
        sun_enu: {$ref: "#/components/schemas/Vec3Unit", description: "Напрямок на Сонце в (схід, північ, зеніт) точки — для виду «з поверхні»"}
        earth_direction_me: {$ref: "#/components/schemas/Vec3Unit"}
        earth_elevation_deg: {type: number}
        earth_azimuth_deg: {type: number}
        earth_enu: {$ref: "#/components/schemas/Vec3Unit"}

    Scene:
      type: object
      required: [datetime, frame, orientation_note, light, bodies, sub_solar_point, sub_earth_point, moon_illumination, markers, selected, extras]
      properties:
        datetime: {type: string, format: date-time}
        frame: {const: icrf_geocentric_km}
        orientation_note: {type: string}
        light:
          type: object
          required: [direction_icrf, source]
          properties:
            direction_icrf: {$ref: "#/components/schemas/Vec3Unit"}
            source: {const: sun}
        bodies: {type: array, minItems: 3, maxItems: 3, items: {$ref: "#/components/schemas/SceneBody"}}
        sub_solar_point: {$ref: "#/components/schemas/LatLon"}
        sub_earth_point: {$ref: "#/components/schemas/LatLon"}
        moon_illumination:
          type: object
          required: [fraction, phase_angle_deg]
          properties:
            fraction: {type: number, minimum: 0, maximum: 1}
            phase_angle_deg: {type: number}
        markers:
          type: object
          required: [earth, moon]
          properties:
            earth: {type: array, items: {$ref: "#/components/schemas/SceneMarkerEarth"}}
            moon: {type: array, items: {$ref: "#/components/schemas/SceneMarkerMoon"}}
        selected:
          oneOf:
            - {$ref: "#/components/schemas/SceneSelected"}
            - {type: "null"}
        extras:
          type: array
          description: "Ракета, траєкторія й модуль (П-5) — лише з параметром launch_site; інакше порожній"
          items: {$ref: "#/components/schemas/SceneExtra"}

    SceneExtra:
      description: Додатковий об'єкт сцени; тип — у полі kind
      oneOf:
        - {$ref: "#/components/schemas/SceneRocket"}
        - {$ref: "#/components/schemas/SceneTrajectory"}
        - {$ref: "#/components/schemas/SceneLander"}
        - {$ref: "#/components/schemas/SceneGroundTrack"}
        - {$ref: "#/components/schemas/SceneLaunchChoice"}

    SceneRocket:
      type: object
      required: [kind, id, site_id, name, lat, lon, unit_itrs]
      properties:
        kind: {const: rocket}
        id: {type: string}
        site_id: {type: string}
        name: {type: string}
        lat: {type: number}
        lon: {type: number}
        unit_itrs: {$ref: "#/components/schemas/Vec3Unit"}

    SceneTrajectory:
      type: object
      required: [kind, id, frame, points_km, departure_utc, arrival_utc, tof_days, dv_tli_m_s, dv_loi_m_s, c3_km2_s2,
                 moon_at_arrival_km, launch_site_id, inclination_deg, windows_per_day, note]
      properties:
        kind: {const: trajectory}
        id: {type: string}
        frame: {const: icrf_geocentric_km}
        points_km:
          type: array
          minItems: 2
          items: {type: array, minItems: 3, maxItems: 3, items: {type: number}}
          description: "Дуга від паркувальної орбіти до центру Місяця в момент прибуття (задача двох тіл)"
        departure_utc: {type: string, format: date-time}
        arrival_utc: {type: string, format: date-time}
        tof_days: {type: number}
        dv_tli_m_s: {type: number}
        dv_loi_m_s: {type: number}
        c3_km2_s2: {type: number}
        moon_at_arrival_km: {type: array, minItems: 3, maxItems: 3, items: {type: number}}
        launch_site_id: {type: string}
        inclination_deg: {type: number, description: "Нахил площини відльоту max(|φ|, |δ_Місяця|)"}
        windows_per_day: {type: integer, minimum: 0, maximum: 2}
        note: {type: string}

    SceneLander:
      type: object
      required: [kind, id, lat, lon, unit_me]
      properties:
        kind: {const: lander}
        id: {type: string}
        lat: {type: number}
        lon: {type: number}
        unit_me: {$ref: "#/components/schemas/Vec3Unit"}

    SceneGroundTrack:
      type: object
      required: [kind, id, departure_utc, inclination_deg, points_latlon, note]
      properties:
        kind: {const: ground_track}
        id: {type: string}
        departure_utc: {type: string, format: date-time}
        inclination_deg: {type: number}
        points_latlon:
          type: array
          minItems: 2
          items: {type: array, minItems: 2, maxItems: 2, items: {type: number}}
          description: "[широта, довгота] траси площини відльоту на Землі в момент старту"
        note: {type: string}

    LaunchOption:
      type: object
      required: [site, criterion, departure_utc, arrival_utc, wait_h, tof_days, total_h, inclination_deg,
                 dv_transfer_m_s, dv_site_penalty_m_s, dv_total_m_s, normal_icrf, note]
      properties:
        site:
          type: object
          required: [id, name, kind, lat, lon]
          properties:
            id: {type: string, description: "id з /launch-sites або any-point"}
            name: {type: string}
            kind: {type: string, enum: [spaceport, sea_platform, air_launch, custom]}
            lat: {type: number}
            lon: {type: number}
        criterion: {type: string, enum: [fuel, speed]}
        departure_utc: {type: string, format: date-time}
        arrival_utc: {type: string, format: date-time}
        wait_h: {type: number, minimum: 0, description: Очікування вікна від моменту сцени, год}
        tof_days: {type: number}
        total_h: {type: number, description: "Від моменту сцени до прибуття, год"}
        inclination_deg: {type: number, description: Нахил площини відльоту до екватора}
        dv_transfer_m_s: {type: number, description: "Перехід: TLI + гальмування біля Місяця"}
        dv_site_penalty_m_s: {type: number, description: "Недобір прибавки від обертання Землі: 465,1·(1 − cos i)"}
        dv_total_m_s: {type: number}
        normal_icrf: {$ref: "#/components/schemas/Vec3Unit"}
        note: {type: string}

    SceneLaunchChoice:
      type: object
      required: [kind, id, criterion, scope, start_utc, best, alternatives]
      properties:
        kind: {const: launch_choice}
        id: {type: string}
        criterion: {type: string, enum: [fuel, speed]}
        scope: {type: string, enum: [spaceports, any]}
        start_utc: {type: string, format: date-time}
        best: {$ref: "#/components/schemas/LaunchOption"}
        alternatives: {type: array, items: {$ref: "#/components/schemas/LaunchOption"}}

    LaunchFactor:
      type: string
      enum: [fuel, speed, windows, cost, risk]
      description: "fuel — маса на НОО (паливо), speed — тривалість перельоту, windows — вікна на добу, cost — вартість запуску, risk — ризик"

    LaunchRankingRequest:
      type: object
      required: [lat, lon]
      additionalProperties: false
      properties:
        lat: {type: number, minimum: -90, maximum: 90, description: Селенографічна широта точки посадки}
        lon: {type: number, minimum: -180, maximum: 360, description: Селенографічна довгота на схід}
        datetime: {type: string, format: date-time, description: "Момент старту (TLI); без зони — UTC; без поля — зараз"}
        mass_moon_kg: {type: number, exclusiveMinimum: 0, description: "Маса, що сідає на Місяць; без поля — з моделі місії (crew, days, sizes)"}
        crew: {type: integer, minimum: 0, maximum: 6, default: 0}
        days: {type: number, minimum: 0, maximum: 365, default: 0}
        sizes:
          type: object
          additionalProperties: false
          properties:
            equipment: {$ref: "#/components/schemas/PayloadSize"}
            life_support: {$ref: "#/components/schemas/PayloadSize"}
            comfort: {$ref: "#/components/schemas/PayloadSize"}
        vehicle: {type: string, default: any, description: "id ракети (rockets.json) чи системи запуску, або any"}
        trajectories:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [direct, low_energy]}
          default: [direct, low_energy]
        priorities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/LaunchFactor"}
          default: [fuel, speed, windows, cost, risk]
        mode: {type: string, enum: [weighted, maximin], default: weighted}
        include_design_targets: {type: boolean, default: true, description: "Включати ракети у випробуваннях і проєктні цілі"}
        allow_multiple_launches: {type: boolean, default: false, description: "Дозволити кілька пусків зі стикуванням, якщо маса не вміщується"}
        limit: {type: integer, minimum: 1, maximum: 200, default: 30}

    LaunchTransfer:
      type: object
      required: [trajectory, name, method, duration_days, arrival_utc, dv_tli_m_s, dv_loi_m_s, dv_total_m_s, c3_km2_s2]
      additionalProperties: false
      properties:
        trajectory: {type: string, enum: [direct, low_energy]}
        name: {type: string}
        method: {type: string, enum: [patched_conic, estimate], description: "estimate — оцінка відносно прямого переходу"}
        duration_days: {$ref: "#/components/schemas/Range2"}
        arrival_utc: {type: array, minItems: 2, maxItems: 2, items: {type: string, format: date-time}}
        dv_tli_m_s:
          oneOf: [{$ref: "#/components/schemas/Range2"}, {type: "null"}]
        dv_loi_m_s:
          oneOf: [{$ref: "#/components/schemas/Range2"}, {type: "null"}]
        dv_total_m_s: {$ref: "#/components/schemas/Range2"}
        c3_km2_s2: {type: [number, "null"], description: "Характеристична енергія найкращого прямого переходу"}

    LaunchRankingOption:
      type: object
      required: [rank, score_pct, pareto, fits, fit_note, site, vehicle, trajectory, inclination_deg, windows_per_day,
                 inertial_azimuths_deg, dv_total_m_s, dv_site_penalty_m_s, duration_days, mass_leo_kg, capacity_basis,
                 utilization, launches, launch_cost_usd, risk, factors, provisional_fields]
      additionalProperties: false
      properties:
        rank: {type: integer, minimum: 1}
        score_pct: {type: number, minimum: 0, maximum: 100}
        pareto: {type: boolean}
        fits: {type: boolean, description: "false — маса не вміщується в ракету (а кілька пусків не дозволено)"}
        fit_note: {type: [string, "null"]}
        site:
          type: object
          required: [id, name, kind, lat, lon]
          additionalProperties: false
          properties:
            id: {type: string}
            name: {type: string}
            kind: {type: string, enum: [spaceport, sea_platform, air_launch, custom]}
            lat: {type: number}
            lon: {type: number}
        vehicle:
          type: object
          required: [id, name, catalog, status, verified_by_flight]
          additionalProperties: false
          properties:
            id: {type: string}
            name: {type: string}
            catalog: {type: string, enum: [rockets, launch_systems]}
            status: {type: [string, "null"], enum: [active, in_testing, design_target, retired, null]}
            verified_by_flight: {type: [boolean, "null"]}
        trajectory: {type: string, enum: [direct, low_energy]}
        inclination_deg: {type: number, description: "Нахил площини відльоту max(|φ|, |δ_Місяця|)"}
        windows_per_day: {type: integer, minimum: 0, maximum: 2}
        inertial_azimuths_deg: {type: array, items: {type: number}}
        dv_total_m_s: {$ref: "#/components/schemas/Range2"}
        dv_site_penalty_m_s: {type: number, description: "Втрата прибавки від обертання Землі + доворот площини"}
        duration_days: {$ref: "#/components/schemas/Range2"}
        mass_leo_kg: {type: number}
        capacity_basis: {type: string, enum: [tli, leo], description: "За якою місткістю ракети порахована заповненість"}
        utilization: {type: number, minimum: 0}
        launches: {type: integer, minimum: 1}
        launch_cost_usd: {$ref: "#/components/schemas/Range2"}
        risk:
          type: object
          required: [p, range, band, band_label]
          additionalProperties: false
          properties:
            p: {type: number, minimum: 0, maximum: 1}
            range: {$ref: "#/components/schemas/Range2"}
            band: {type: string, enum: [low, moderate, high, very_high]}
            band_label: {type: string}
        factors:
          type: object
          description: Оцінки факторів 0…1 («більше — краще») для факторів із пріоритетів
          additionalProperties: {type: number, minimum: 0, maximum: 1}
        provisional_fields: {type: array, items: {type: string}}

    PlanRequest:
      type: object
      required: [start, end]
      additionalProperties: false
      description: |
        Поля вибору місця — як у SearchRequest (регіон, сітка, вимоги, профіль місії, пріоритети місця),
        поля запуску — як у LaunchRankingRequest, склад місії — як у MissionRequest.
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        departure: {type: string, format: date-time, description: Момент старту TLI; без нього — start}
        region: {type: object}
        include_catalog: {type: boolean}
        grid_step_deg: {type: number}
        max_candidates: {type: integer}
        step_h: {type: number}
        height_m: {type: number}
        priorities: {type: array, items: {type: string}, description: Пріоритети вибору місця посадки}
        mode: {type: string, enum: [weighted, maximin]}
        params: {type: object}
        min_sun_hours: {type: number, minimum: 0}
        min_comm_hours: {type: number, minimum: 0}
        max_slope_deg: {type: number, minimum: 0, maximum: 90}
        min_earth_fraction: {type: number, minimum: 0, maximum: 1}
        min_sun_fraction: {type: number, minimum: 0, maximum: 1}
        mission_profile: {type: string, enum: [uncrewed, crewed]}
        crew: {type: integer, minimum: 0}
        days: {type: number, minimum: 0}
        sizes: {type: object}
        earth_target: {type: object}
        vehicle: {type: string, default: any, description: "any (автовибір ракети) або id з /launch-systems"}
        trajectories: {type: array, items: {$ref: "#/components/schemas/Trajectory"}}
        launch_priorities: {type: array, items: {$ref: "#/components/schemas/LaunchFactor"}}
        launch_mode: {type: string, enum: [weighted, maximin]}
        include_design_targets: {type: boolean, default: true}
        allow_multiple_launches: {type: boolean, default: false}
        landing_candidates: {type: integer, minimum: 1, maximum: 10, default: 3, description: Скільки найкращих місць комбінувати із запусками}
        limit: {type: integer, minimum: 1, maximum: 20, default: 5, description: Скільки планів повернути}

    PlanResponse:
      type: object
      required: [provisional, period, departure_utc, grid, landing_evaluated, hard_requirements_met, auto_selected,
                 plans, explanation, notes]
      properties:
        provisional: {const: true}
        period: {type: object}
        departure_utc: {type: string, format: date-time}
        grid: {type: object}
        landing_evaluated: {type: integer, minimum: 0}
        hard_requirements_met: {type: boolean, description: Чи є хоч одне місце, що виконує всі жорсткі вимоги}
        auto_selected: {type: [integer, "null"], description: Ранг обраного автоматично плану}
        plans:
          type: array
          items:
            type: object
            required: [rank, score_pct, landing, requirements, mass_moon_kg, launch, route, mission]
            properties:
              rank: {type: integer, minimum: 1}
              score_pct: {type: number}
              landing: {type: object}
              requirements:
                type: object
                required: [feasible, violations, warnings, unchecked]
                properties:
                  feasible: {type: boolean}
                  violations: {type: array, items: {$ref: "#/components/schemas/RankViolation"}}
                  warnings: {type: array, items: {$ref: "#/components/schemas/RankWarning"}}
                  unchecked: {type: array, items: {type: string}}
              mass_moon_kg: {type: number}
              launch:
                oneOf:
                  - {$ref: "#/components/schemas/LaunchRankingOption"}
                  - {type: "null"}
              launch_explanation: {type: [string, "null"]}
              route:
                oneOf:
                  - type: object
                    required: [launch_site, moon_site, trajectory, departure_utc, arrival_utc, duration_days]
                  - {type: "null"}
              mission:
                oneOf:
                  - {$ref: "#/components/schemas/MissionResponse"}
                  - {type: "null"}
        explanation: {type: string}
        notes: {type: array, items: {type: string}}

    LaunchRankingResponse:
      type: object
      required: [departure_utc, moon_point, mass_moon_kg, moon_declination_deg, priorities, mode, provisional,
                 transfers, options, excluded, total_options, leader_explanation]
      additionalProperties: false
      properties:
        departure_utc: {type: string, format: date-time}
        moon_point: {$ref: "#/components/schemas/LatLon"}
        mass_moon_kg: {type: number}
        moon_declination_deg: {type: number, description: "|δ| Місяця в момент прибуття — мінімальний нахил площини"}
        priorities: {type: array, items: {$ref: "#/components/schemas/LaunchFactor"}}
        mode: {type: string, enum: [weighted, maximin]}
        provisional: {const: true}
        transfers:
          type: object
          additionalProperties: {$ref: "#/components/schemas/LaunchTransfer"}
        options: {type: array, items: {$ref: "#/components/schemas/LaunchRankingOption"}}
        excluded:
          type: array
          items:
            type: object
            required: [vehicle_id, reason]
            additionalProperties: false
            properties:
              vehicle_id: {type: string}
              reason: {type: string}
        total_options: {type: integer, minimum: 0, description: "Скільки варіантів до обрізання limit"}
        leader_explanation: {type: [string, "null"], description: "Чому лідер кращий за наступний варіант"}
