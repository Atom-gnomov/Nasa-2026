openapi: 3.1.0
info:
  title: Lunar Site Explorer API
  version: 1.0.0
  description: |
    Контракт API між бекендом (Flask) і фронтендом, а також для майбутніх джерел даних.
    Людиночитний опис, домовленості та приклади — docs/CONTRACTS.md. Математика — docs/MATH.md.

    Статус кожної операції — у полі `x-status`:
      - implemented — працює зараз;
      - planned — контракт зафіксовано, сервер поки відповідає 501 `not_implemented`.

    Домовленості (коротко):
      - кути в градусах, довжини в км (суфікс _km) або м (_m), час у годинах (_h) або секундах (_s);
      - дата й час — ISO 8601; у відповідях завжди UTC із суфіксом Z; у запиті без зони = UTC;
      - селенографічна довгота на схід; у відповідях нормалізована до [-180, 180);
      - азимут від півночі за годинниковою стрілкою, 0..360; на самому полюсі «північ» — напрямок на меридіан lon;
      - null у полях hours_to_* означає «події немає в межах вікна пошуку».
servers:
  - url: /api
tags:
  - name: service
  - name: catalog
  - name: point
  - name: period
  - name: system
  - name: planning

paths:
  /health:
    get:
      tags: [service]
      x-status: implemented
      summary: Перевірка, що сервер живий
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}

  /meta:
    get:
      tags: [service]
      x-status: implemented
      summary: Версії, джерела даних і ліміти сервера
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Meta"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /sites:
    get:
      tags: [catalog]
      x-status: implemented
      summary: Каталог місць посадки
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Site"}

  /sites/{site_id}:
    get:
      tags: [catalog]
      x-status: implemented
      summary: Одне місце посадки
      parameters:
        - {name: site_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Site"}
        "404": {$ref: "#/components/responses/NotFound"}

  /dsn:
    get:
      tags: [catalog]
      x-status: implemented
      summary: Станції Deep Space Network
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/DsnStation"}

  /launch-sites:
    get:
      tags: [catalog]
      x-status: implemented
      summary: Космодроми та інші місця старту
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LaunchSite"}

  /metrics:
    get:
      tags: [point]
      x-status: implemented
      summary: Метрики точки на Місяці в один момент (оверлей)
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
        - $ref: "#/components/parameters/datetime"
        - $ref: "#/components/parameters/height"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SiteMetrics"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /compare:
    get:
      tags: [point]
      x-status: implemented
      summary: Метрики кількох місць каталогу на одну дату
      parameters:
        - name: site
          in: query
          required: true
          description: id місця; повторити параметр 2+ рази
          schema: {type: array, items: {type: string}, minItems: 2}
          style: form
          explode: true
        - $ref: "#/components/parameters/datetime"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CompareItem"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /horizon:
    get:
      tags: [point]
      x-status: implemented
      summary: Маска горизонту точки з рельєфу LOLA (графік горизонту, 3D-вид «з поверхні», доза ГКП)
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
        - $ref: "#/components/parameters/height"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HorizonMask"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /timeline:
    get:
      tags: [period]
      x-status: implemented
      summary: Часові ряди й підсумки за період (графіки, повзунки «години Сонця / зв'язку»)
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
        - $ref: "#/components/parameters/height"
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/end"
        - name: step_h
          in: query
          description: Крок сітки, год. Сервер може збільшити крок, щоб точок було не більше limits.max_points (див. /meta).
          schema: {type: number, minimum: 0.1, maximum: 24, default: 1}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Timeline"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /events:
    get:
      tags: [period]
      x-status: implemented
      summary: Усі сходи й заходи Сонця, Землі та станцій DSN за період (до 120 діб)
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
        - $ref: "#/components/parameters/height"
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/end"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EventList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "501": {$ref: "#/components/responses/NotImplemented"}

  /system:
    get:
      tags: [system]
      x-status: implemented
      summary: Стан системи Сонце–Земля–Місяць для 3D-сцени на момент часу
      parameters:
        - $ref: "#/components/parameters/datetime"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemState"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /orbits:
    get:
      tags: [system]
      x-status: implemented
      summary: Оскулюючі орбіти Місяця й Землі (ICRF, км) і справжній шлях за ±½ періоду — для 3D-виду
      parameters:
        - $ref: "#/components/parameters/datetime"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Orbits"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /temperature:
    get:
      tags: [point]
      x-status: implemented
      summary: Температура поверхні в точці за вимірюваннями LRO Diviner (на дату за місцевим часом, добова крива, полярний PRP)
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
        - $ref: "#/components/parameters/datetime"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TemperaturePoint"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /temperature/map:
    get:
      tags: [point]
      x-status: implemented
      summary: Мапа температури (Diviner) для шару глобуса — коди 0…255 у base64
      parameters:
        - name: kind
          in: query
          description: now — на дату за місцевим часом; max / min / mean — за місячну добу; prp_* та ice_depth — південний полюс
          schema: {enum: [now, max, min, mean, prp_max, prp_avg, ice_depth], default: now}
        - $ref: "#/components/parameters/datetime"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TemperatureMap"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /elevation:
    get:
      tags: [point]
      x-status: implemented
      summary: Висота поверхні в точці з найдетальнішого доступного DEM LOLA (PDS)
      parameters:
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Elevation"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /rank:
    post:
      tags: [planning]
      x-status: implemented
      summary: Ранжування точок за факторами й порівняння найкращої з наступною
      description: |
        Для кожної точки за період рахуються підсумки (як у /timeline) і оцінки факторів 0..1 за
        абсолютними шкалами (docs/MATH.md, §19), тож оцінка точки не залежить від того, які ще точки
        в списку. Ваги — з порядку `priorities` (ROC). Режим `weighted` — зважена сума,
        `maximin` — найгірший фактор. Точки, що не виконують `requirements`, лишаються в списку
        з `feasible: false` і йдуть після допустимих. `comparison` — найкраща проти другої.
        Фактор `temperature` потребує даних Diviner (інакше 503).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RankRequest"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RankResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /search:
    post:
      tags: [planning]
      x-status: implemented
      summary: Підбір найкращих точок у регіоні за вимогами й пріоритетами (з найкращою станцією DSN для кожної)
      description: |
        Будує сітку кандидатів у `region`, оцінює кожну тією самою формулою, що й `/rank`
        (docs/MATH.md, §19), і повертає `limit` найкращих: допустимі (виконують `min_sun_hours` /
        `min_comm_hours`) — першими. Для кожної точки вказується станція DSN з найбільшою кількістю
        годин зв'язку за період. Пошук обмежений бюджетом часу сервера: якщо його вичерпано, відповідь
        містить оцінені кандидати й `grid.truncated: true`.
        Місце старту, вартість, ризик і час польоту (`launch_site_ids`, `trajectory`, фактори
        cost / risk / flight_time) з'являться з моделлю запусків — поки запит із ними відхиляється (400).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SearchRequest"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SearchResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /advice:
    post:
      tags: [planning]
      x-status: planned
      summary: Поради й пояснення від відкритої LLM щодо готових результатів розрахунків (друга черга)
      description: |
        LLM лише інтерпретує числа, надані у `facts`; вона нічого не рахує. Усі числа у відповіді
        перевіряються на наявність у `facts` (`verified`). Вимкнено, якщо не задано LSE_LLM_BASE_URL —
        тоді 503 `unavailable` з поясненням. Виклик до LLM лише з бекенду; персональні дані не передаються.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdviceRequest"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdviceResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "501": {$ref: "#/components/responses/NotImplemented"}
        "503": {$ref: "#/components/responses/Unavailable"}

  /launch-window:
    get:
      tags: [planning]
      x-status: planned
      summary: Вікно запуску — оцінка у % для кожної дати
      parameters:
        - {name: launch_site, in: query, required: true, schema: {type: string}, description: id з /launch-sites}
        - $ref: "#/components/parameters/lat"
        - $ref: "#/components/parameters/lon"
        - $ref: "#/components/parameters/start"
        - $ref: "#/components/parameters/end"
        - name: trajectory
          in: query
          schema: {$ref: "#/components/schemas/Trajectory"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LaunchWindow"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "501": {$ref: "#/components/responses/NotImplemented"}

components:
  parameters:
    lat:
      name: lat
      in: query
      required: true
      description: Селенографічна широта, градуси (південь — від'ємна)
      schema: {type: number, minimum: -90, maximum: 90}
    lon:
      name: lon
      in: query
      required: true
      description: Селенографічна довгота на схід, градуси; приймається -180..360
      schema: {type: number, minimum: -180, maximum: 360}
    datetime:
      name: datetime
      in: query
      description: Момент часу ISO 8601; без зони — UTC; без параметра — поточний момент
      schema: {type: string, format: date-time}
    height:
      name: height
      in: query
      description: Висота щогли/панелі над ґрунтом, м
      schema: {type: number, minimum: 0, maximum: 1000, default: 0}
    start:
      name: start
      in: query
      required: true
      schema: {type: string, format: date-time}
    end:
      name: end
      in: query
      required: true
      description: Кінець періоду; період не довший за limits.max_period_days (/meta)
      schema: {type: string, format: date-time}

  responses:
    BadRequest:
      description: Невірні параметри
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Не знайдено
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotImplemented:
      description: Контракт зафіксовано, реалізації ще немає
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unavailable:
      description: Немає потрібних даних на сервері (наприклад, файлу ефемерид)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      required: [error, detail]
      additionalProperties: false
      properties:
        error:
          type: string
          enum: [bad_request, not_found, not_implemented, unavailable, internal]
        detail:
          type: string
          description: Пояснення українською — фронтенд показує його користувачу як є

    Health:
      type: object
      required: [status]
      properties:
        status: {const: ok}

    Meta:
      type: object
      required: [api_version, ephemeris, moon_orientation, moon_radius_km, data_sources, limits]
      properties:
        api_version: {type: string, examples: ["1.0.0"]}
        ephemeris: {type: string, examples: ["JPL DE440"]}
        moon_orientation: {type: string, examples: ["IAU 2015 (Archinal et al., 2018)"]}
        moon_radius_km: {type: number, examples: [1737.4]}
        data_sources:
          type: array
          items:
            type: object
            required: [id, kind, description]
            properties:
              id: {type: string}
              kind: {type: string, enum: [ephemeris, dem, horizon_masks, illumination, temperature, sites, stations, launch_sites, other]}
              description: {type: string}
              version: {type: string}
              url: {type: string}
        limits:
          type: object
          properties:
            max_period_days: {type: number}
            max_points: {type: integer}
            event_search_hours: {type: number}
            max_event_period_days: {type: number}
            max_rank_points: {type: integer}

    LatLon:
      type: object
      required: [lat, lon]
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 360}

    Site:
      type: object
      required: [id, name, lat, lon, category, note, verified]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^[a-z0-9-]+$"}
        name: {type: string}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 360}
        category: {type: string, enum: [apollo, clps, artemis, international, custom]}
        note: {type: string}
        verified: {type: boolean, description: Координати звірено з першоджерелом}

    DsnStation:
      type: object
      required: [id, name, antenna, lat, lon, elevation_m, min_elevation_deg]
      additionalProperties: false
      properties:
        id: {type: string}
        name: {type: string}
        antenna: {type: string}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
        elevation_m: {type: number, description: Висота над еліпсоїдом WGS84}
        min_elevation_deg: {type: number, description: Мінімальний кут місця антени}

    LaunchSite:
      type: object
      required: [id, name, lat, lon, kind, verified]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^[a-z0-9-]+$"}
        name: {type: string}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
        kind: {type: string, enum: [spaceport, sea_platform, air_launch, custom]}
        country: {type: string}
        note: {type: string}
        verified: {type: boolean}

    SiteMetrics:
      type: object
      description: Відповідь /metrics. Поля додаються лише зворотно сумісно.
      required:
        - lat
        - lon
        - height_m
        - datetime
        - sun_elevation_deg
        - sun_azimuth_deg
        - sun_visible_fraction
        - earth_elevation_deg
        - earth_azimuth_deg
        - earth_visible_fraction
        - earth_visible
        - earth_distance_km
        - signal_delay_s
        - recommended_station
        - hours_to_sunset
        - hours_to_sunrise
        - hours_to_earthset
        - hours_to_earthrise
        - event_search_hours
      properties:
        lat: {type: number}
        lon: {type: number, minimum: -180, maximum: 180}
        height_m: {type: number}
        datetime: {type: string, format: date-time, description: UTC із Z}
        sun_elevation_deg: {type: number, minimum: -90, maximum: 90}
        sun_azimuth_deg: {type: number, minimum: 0, maximum: 360}
        sun_visible_fraction: {type: number, minimum: 0, maximum: 1, description: Частка диска Сонця над маскою горизонту}
        earth_elevation_deg: {type: number, minimum: -90, maximum: 90}
        earth_azimuth_deg: {type: number, minimum: 0, maximum: 360}
        earth_visible_fraction: {type: number, minimum: 0, maximum: 1}
        earth_visible: {type: boolean, description: Центр Землі над маскою горизонту}
        earth_distance_km: {type: number}
        signal_delay_s: {type: number, description: Затримка в один бік до рекомендованої станції (або центру Землі)}
        recommended_station: {type: [string, "null"], description: id станції DSN або null, якщо зв'язку немає}
        hours_to_sunset: {type: [number, "null"]}
        hours_to_sunrise: {type: [number, "null"]}
        hours_to_earthset: {type: [number, "null"]}
        hours_to_earthrise: {type: [number, "null"]}
        event_search_hours: {type: number, description: Вікно пошуку подій; null у hours_to_* = події немає в цьому вікні}
        local_solar_time_h: {type: number, minimum: 0, maximum: 24, description: "Місцевий сонячний час: 12 год — Сонце на меридіані точки"}
        sun_distance_km: {type: number}
        solar_irradiance_w_m2: {type: number, description: "S = 1361 · (1 а.о. / r)² (docs/MATH.md, §10)"}
        panel_power_vertical_w_m2: {type: number, description: Вертикальна панель 1 м² зі стеженням за Сонцем, η = 0,30, з тінню від рельєфу}
        panel_power_horizontal_w_m2: {type: number, description: Горизонтальна панель 1 м², η = 0,30}
        horizon_source: {type: string, description: "Набір DEM, з якого збудовано маску горизонту, або flat"}
        stations:
          type: array
          description: Усі станції DSN у цей момент (умови зв'язку — docs/MATH.md, §9.2)
          items:
            type: object
            required: [id, name, moon_elevation_deg, station_elevation_deg, min_elevation_deg, available]
            properties:
              id: {type: string}
              name: {type: string}
              moon_elevation_deg: {type: number, description: Місяць над горизонтом станції}
              station_elevation_deg: {type: number, description: Станція над математичним горизонтом точки на Місяці}
              min_elevation_deg: {type: number}
              available: {type: boolean, description: Станція видна з точки над маскою рельєфу й Місяць вище мінімального кута антени}

    CompareItem:
      type: object
      required: [site, metrics]
      properties:
        site: {$ref: "#/components/schemas/Site"}
        metrics: {$ref: "#/components/schemas/SiteMetrics"}

    HorizonMask:
      type: object
      required: [lat, lon, observer_height_m, azimuth_step_deg, elevations_deg, source, sky_view_fraction]
      properties:
        lat: {type: number}
        lon: {type: number}
        observer_height_m: {type: number}
        azimuth_step_deg: {type: number, exclusiveMinimum: 0, description: Азимут i-го елемента = i * step}
        elevations_deg:
          type: array
          items: {type: number, minimum: -90, maximum: 90}
          minItems: 4
        source: {type: string, description: "flat — гладка сфера; інакше id набору DEM (див. /meta)", examples: [flat, lola_20m]}
        max_distance_km: {type: number}
        sky_view_fraction: {type: number, minimum: 0, maximum: 1.2, description: Частка відкритого неба відносно півсфери}
        max_elevation_deg: {type: number, description: Найвища точка горизонту}
        gcr_dose_usv_per_day: {type: number, description: "Оцінка дози ГКП: 1369 мкЗв/добу (Chang'e 4 LND, Zhang et al. 2020) × частка відкритого неба (docs/MATH.md, §12)"}

    Track:
      type: object
      description: Значення в моменти Timeline.times (масиви однакової довжини)
      required: [azimuth_deg, elevation_deg, visible_fraction]
      properties:
        azimuth_deg: {type: array, items: {type: number}}
        elevation_deg: {type: array, items: {type: number}}
        visible_fraction: {type: array, items: {type: number, minimum: 0, maximum: 1}}

    StationTrack:
      type: object
      required: [station_id, available, moon_elevation_deg]
      properties:
        station_id: {type: string}
        available: {type: array, items: {type: boolean}}
        moon_elevation_deg: {type: array, items: {type: number}}

    PeriodSummary:
      type: object
      description: Підсумки за період у земних годинах (docs/MATH.md, §8, §10)
      required: [period_h, sun_hours, comm_hours, sun_fraction, comm_fraction, longest_night_h, longest_comm_gap_h]
      properties:
        period_h: {type: number}
        sun_hours: {type: number, description: "Σ частка диска · Δt"}
        comm_hours: {type: number, description: Години, коли доступна хоча б одна станція DSN}
        sun_fraction: {type: number, minimum: 0, maximum: 1}
        comm_fraction: {type: number, minimum: 0, maximum: 1}
        longest_night_h: {type: number}
        longest_comm_gap_h: {type: number}
        energy_wh_per_m2: {type: number, description: Вертикальна панель зі стеженням, η = 0,30}
        earth_hours: {type: number, description: Години, коли центр диска Землі над маскою горизонту (незалежно від станцій)}
        earth_fraction: {type: number, minimum: 0, maximum: 1}

    Timeline:
      type: object
      required: [lat, lon, height_m, step_h, times, sun, earth, stations, summary]
      properties:
        lat: {type: number}
        lon: {type: number}
        height_m: {type: number}
        step_h: {type: number}
        times: {type: array, items: {type: string, format: date-time}}
        sun: {$ref: "#/components/schemas/Track"}
        earth: {$ref: "#/components/schemas/Track"}
        stations: {type: array, items: {$ref: "#/components/schemas/StationTrack"}}
        summary: {$ref: "#/components/schemas/PeriodSummary"}
        horizon_source: {type: string, description: "Набір DEM, з якого збудовано маску горизонту, або flat"}

    Event:
      type: object
      required: [body, kind, datetime]
      properties:
        body: {type: string, description: "sun | earth | station:<id>", examples: [sun, earth, "station:canberra"]}
        kind: {type: string, enum: [rise, set]}
        datetime: {type: string, format: date-time}

    EventList:
      type: object
      required: [lat, lon, start, end, events]
      properties:
        lat: {type: number}
        lon: {type: number}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        events: {type: array, items: {$ref: "#/components/schemas/Event"}}

    Vector3:
      type: array
      items: {type: number}
      minItems: 3
      maxItems: 3

    SystemState:
      type: object
      description: |
        Положення тіл для 3D-сцени. Система координат — ICRF з початком у центрі Землі, км.
        Орієнтація Місяця — матриця ICRF → MOON_ME (рядки), щоб накласти текстуру й поставити точку посадки.
      required: [datetime, frame, sun_km, moon_km, moon_orientation, sub_solar_point, sub_earth_point, earth_rotation_deg]
      properties:
        datetime: {type: string, format: date-time}
        frame: {const: icrf_geocentric_km}
        sun_km: {$ref: "#/components/schemas/Vector3"}
        moon_km: {$ref: "#/components/schemas/Vector3"}
        moon_orientation:
          type: array
          description: Матриця 3×3 ICRF → MOON_ME
          items: {$ref: "#/components/schemas/Vector3"}
          minItems: 3
          maxItems: 3
        sub_solar_point: {$ref: "#/components/schemas/LatLon"}
        sub_earth_point: {$ref: "#/components/schemas/LatLon"}
        earth_rotation_deg: {type: number, description: Зоряний час Гринвіча (GAST), для повороту текстури Землі}
        earth_orientation:
          type: array
          description: |
            Матриця 3×3 ICRF → ITRS (земна система: прецесія, нутація, зоряний час).
            Щоб повернути модель Землі, застосувати транспоновану матрицю (ITRS → ICRF), як і для Місяця.
          items: {$ref: "#/components/schemas/Vector3"}
          minItems: 3
          maxItems: 3
        earth_sub_solar_point:
          $ref: "#/components/schemas/LatLon"
          description: Точка на Землі, де Сонце в зеніті (WGS84, геодезична широта)
        earth_sub_lunar_point:
          $ref: "#/components/schemas/LatLon"
          description: Точка на Землі, де Місяць у зеніті — орієнтир для вибору станції DSN
        moon_illumination:
          type: object
          description: Фаза Місяця для спостерігача в центрі Землі
          required: [fraction, phase_angle_deg]
          additionalProperties: false
          properties:
            fraction: {type: number, minimum: 0, maximum: 1, description: Частка освітленого диска}
            phase_angle_deg: {type: number, minimum: 0, maximum: 180, description: Кут Сонце–Місяць–Земля}

    OrbitTrack:
      type: object
      description: |
        Оскулююча кеплерівська орбіта з вектора стану DE440 (замкнений еліпс через поточне положення тіла)
        і справжній шлях тіла за ±½ періоду. Координати — ICRF відносно центрального тіла, км.
      required: [center, body, elements, points_km, path_km, max_deviation_km]
      additionalProperties: false
      properties:
        center: {enum: [earth, sun]}
        body: {enum: [moon, earth_moon_barycenter]}
        elements:
          type: object
          required: [a_km, e, inclination_deg, period_days, periapsis_km, apoapsis_km]
          additionalProperties: false
          properties:
            a_km: {type: number, exclusiveMinimum: 0}
            e: {type: number, minimum: 0, exclusiveMaximum: 1}
            inclination_deg: {type: number, description: Нахил до площини екліптики J2000}
            period_days: {type: number, exclusiveMinimum: 0}
            periapsis_km: {type: number}
            apoapsis_km: {type: number}
        points_km: {type: array, items: {$ref: "#/components/schemas/Vector3"}, minItems: 3}
        path_km: {type: array, items: {$ref: "#/components/schemas/Vector3"}, minItems: 2}
        max_deviation_km: {type: number, minimum: 0, description: Найбільше відхилення справжнього шляху від еліпса}

    Orbits:
      type: object
      required: [datetime, frame, moon, earth]
      additionalProperties: false
      properties:
        datetime: {type: string, format: date-time}
        frame: {const: icrf_km}
        moon: {$ref: "#/components/schemas/OrbitTrack"}
        earth: {$ref: "#/components/schemas/OrbitTrack"}

    TemperatureSource:
      type: object
      required: [name, url, reference]
      additionalProperties: false
      properties:
        name: {type: string}
        url: {type: string, format: uri}
        reference: {type: string}

    TemperaturePoint:
      type: object
      description: |
        Болометрична температура LRO Diviner (GCP, комірка 0,5°, бін місцевого часу 15 хв, вимірювання 2009–2015).
        Місцевий сонячний час: 12 год + (довгота − довгота підсонячної точки) / 15°. null — немає вимірювань.
      required: [lat, lon, datetime, local_time_h, sub_solar_lon, now_k, max_k, min_k, mean_k, diurnal, cell, prp, source]
      additionalProperties: false
      properties:
        lat: {type: number}
        lon: {type: number, minimum: -180, maximum: 180}
        datetime: {type: string, format: date-time}
        local_time_h: {type: number, minimum: 0, maximum: 24}
        sub_solar_lon: {type: number}
        now_k: {type: [number, "null"]}
        max_k: {type: [number, "null"]}
        min_k: {type: [number, "null"]}
        mean_k: {type: [number, "null"]}
        diurnal:
          type: array
          items:
            type: object
            required: [ltim_h, tbol_k]
            additionalProperties: false
            properties:
              ltim_h: {type: number}
              tbol_k: {type: [number, "null"]}
        cell:
          type: object
          required: [lat, lon, res_deg]
          properties:
            lat: {type: number}
            lon: {type: number}
            res_deg: {type: number}
        prp:
          description: Південний полюс (Diviner PRP, ~0,5 км); null — точка поза ділянкою
          oneOf:
            - type: "null"
            - type: object
              required: [avg_k, max_k, ice_depth_m, cell_m]
              additionalProperties: false
              properties:
                avg_k: {type: number}
                max_k: {type: number}
                ice_depth_m: {type: [number, "null"], description: "Глибина стабільного водяного льоду; null — нестабільний"}
                cell_m: {type: number}
        source: {$ref: "#/components/schemas/TemperatureSource"}

    TemperatureMap:
      type: object
      description: |
        Сітка кодів 0…255 (base64, рядок 0 — південь / низ полярної площини): значення = code.offset + (код − 1) · code.scale,
        код 0 — немає даних. equirectangular — довгота −180…180, широта −90…90; south_polar_stereographic — площина
        dsmap_polar.cat (x праворуч — 90° сх., y угору — 0°), сторона 2 · half_extent_m.
      required: [kind, datetime, title, units, projection, width, height, code, range, note, source, codes_b64]
      additionalProperties: false
      properties:
        kind: {enum: [now, max, min, mean, prp_max, prp_avg, ice_depth]}
        datetime: {type: string, format: date-time}
        title: {type: string}
        units: {enum: [K, m]}
        projection: {enum: [equirectangular, south_polar_stereographic]}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        half_extent_m: {type: number}
        sub_solar_lon: {type: number}
        code:
          type: object
          required: [offset, scale]
          additionalProperties: false
          properties:
            offset: {type: number}
            scale: {type: number, exclusiveMinimum: 0}
        range: {type: array, items: {type: number}, minItems: 2, maxItems: 2}
        note: {type: string}
        source: {$ref: "#/components/schemas/TemperatureSource"}
        codes_b64: {type: string}

    Elevation:
      type: object
      description: |
        Висота над опорною сферою 1737,4 км (MEAN EARTH/POLAR AXIS), білінійна інтерполяція.
        Джерело — найдетальніший доступний продукт LOLA GDR з PDS (полярні 20/80 м, глобальні 64/16 пікс./град.).
      required: [lat, lon, height_m, radius_km, source]
      additionalProperties: false
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 180}
        height_m: {type: number}
        radius_km: {type: number}
        slope_deg: {type: number, minimum: 0, maximum: 90, description: Нахил поверхні на базі slope_baseline_m}
        aspect_deg: {type: number, minimum: 0, maximum: 360, description: "Експозиція: азимут, куди схил іде вниз (від півночі за годинниковою)"}
        slope_baseline_m: {type: number, description: "База різниць (4 кроки DEM)"}
        source:
          type: object
          required: [id, product_version, resolution_m, projection, url]
          additionalProperties: false
          properties:
            id: {type: string, examples: [ldem_875s_20m]}
            product_version: {type: string}
            resolution_m: {type: number, exclusiveMinimum: 0}
            projection: {type: string}
            url: {type: string, format: uri}

    Factor:
      type: string
      enum: [energy, comms, radiation, temperature, cost, risk, flight_time]

    Trajectory:
      type: string
      enum: [direct, low_energy]
      default: direct

    SearchRequest:
      type: object
      required: [start, end]
      additionalProperties: false
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        region:
          type: object
          additionalProperties: false
          description: Область пошуку на Місяці. Без неї — південна полярна область 80–90° пд. ш. (вся Місяць — з крупнішою сіткою, напр. grid_step_deg ≥ 5).
          properties:
            lat_min: {type: number, minimum: -90, maximum: 90, default: -90}
            lat_max: {type: number, minimum: -90, maximum: 90, default: -80}
            lon_min: {type: number, minimum: -180, maximum: 180, default: -180}
            lon_max: {type: number, minimum: -180, maximum: 180, default: 180}
        grid_step_deg: {type: number, minimum: 0.25, maximum: 30, default: 2, description: Крок сітки кандидатів по широті; по довготі — з поправкою на cos(широти)}
        max_candidates: {type: integer, minimum: 1, maximum: 400, default: 200, description: Якщо сітка більша — 400 з порадою збільшити крок або зменшити область}
        include_catalog: {type: boolean, default: false, description: Додати до кандидатів місця з каталогу}
        step_h: {type: number, minimum: 1, maximum: 24, default: 6, description: Крок часу оцінки, год (грубіший за /rank, бо кандидатів багато)}
        height_m: {type: number, minimum: 0, maximum: 1000, default: 0}
        min_sun_hours: {type: number, minimum: 0, description: Повзунок «години Сонця»}
        min_comm_hours: {type: number, minimum: 0, description: Повзунок «години зв'язку»}
        earth_target: {oneOf: [{$ref: "#/components/schemas/LatLon"}, {type: "null"}], description: Точка на Землі, куди потрібен зв'язок; поки лише повертається в ланцюжку}
        launch_site_ids: {type: array, items: {type: string}, description: Ще не підтримується (модель запусків) — 400}
        trajectory: {oneOf: [{$ref: "#/components/schemas/Trajectory"}, {type: "null"}], description: Ще не підтримується (модель запусків) — 400}
        priorities:
          type: array
          description: Від найважливішого; порядок задає ваги ROC. За замовчуванням [energy, comms].
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/RankFactor"}
        mode: {type: string, enum: [weighted, maximin], default: weighted}
        params:
          type: object
          description: Перевизначення опорних шкал (як у /rank)
          additionalProperties: {type: number}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}

    Chain:
      type: object
      description: Кандидат із оцінкою; місце старту з'явиться з моделлю запусків
      required: [rank, moon_site, dsn_station_id, dsn_hours, launch_site_id, earth_target, feasible, violations, score_pct, pareto, factors, summary, horizon_source]
      properties:
        rank: {type: integer, minimum: 1}
        moon_site:
          type: object
          required: [lat, lon]
          properties:
            site_id: {type: [string, "null"]}
            name: {type: [string, "null"]}
            lat: {type: number}
            lon: {type: number}
        dsn_station_id: {type: [string, "null"], description: Станція з найбільшою кількістю годин зв'язку за період; null — зв'язку немає}
        dsn_hours: {type: number, description: Годин, коли ця станція доступна}
        launch_site_id: {type: [string, "null"], description: Завжди null, доки немає моделі запусків}
        earth_target: {oneOf: [{$ref: "#/components/schemas/LatLon"}, {type: "null"}]}
        feasible: {type: boolean}
        violations:
          type: array
          items: {$ref: "#/components/schemas/RankViolation"}
        score_pct: {type: number, minimum: 0, maximum: 100}
        pareto: {type: boolean, description: Недомінований серед допустимих кандидатів}
        factors:
          type: object
          description: Нормалізовані оцінки 0..1 за кожним фактором
          additionalProperties: {type: number, minimum: 0, maximum: 1}
        summary: {$ref: "#/components/schemas/RankSummary"}
        horizon_source: {type: string}

    SearchResponse:
      type: object
      required: [period, mode, priorities, weights, params, grid, chains, comparison]
      properties:
        period:
          type: object
          required: [start, end, period_h, step_h]
          properties:
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
            period_h: {type: number}
            step_h: {type: number}
        mode: {type: string, enum: [weighted, maximin]}
        priorities: {type: array, items: {$ref: "#/components/schemas/RankFactor"}}
        weights:
          type: object
          additionalProperties: {type: number}
        params:
          type: object
          additionalProperties: {type: number}
        grid:
          type: object
          required: [step_deg, candidates, evaluated, truncated]
          properties:
            step_deg: {type: number}
            candidates: {type: integer, description: Скільки кандидатів у сітці}
            evaluated: {type: integer, description: Скільки встигли оцінити в межах бюджету часу}
            truncated: {type: boolean, description: true — бюджет часу вичерпано, частину кандидатів не оцінено}
            budget_s: {type: number}
        chains: {type: array, items: {$ref: "#/components/schemas/Chain"}}
        comparison:
          oneOf:
            - {$ref: "#/components/schemas/RankComparison"}
            - {type: "null"}

    LaunchWindow:
      type: object
      required: [launch_site_id, trajectory, days, best]
      properties:
        launch_site_id: {type: string}
        trajectory: {$ref: "#/components/schemas/Trajectory"}
        days:
          type: array
          items:
            type: object
            required: [date, score_pct]
            properties:
              date: {type: string, format: date}
              score_pct: {type: number, minimum: 0, maximum: 100}
              arrival: {type: string, format: date-time}
        best:
          type: object
          required: [date, score_pct]
          properties:
            date: {type: string, format: date}
            score_pct: {type: number}

    AdviceRequest:
      type: object
      required: [facts]
      additionalProperties: false
      properties:
        facts:
          type: object
          description: |
            Готові результати розрахунків — єдине, що бачить модель. Рекомендовані ключі:
            site (назва, lat, lon), period (start, end), metrics (SiteMetrics), summary (PeriodSummary),
            mission (розмір категорій, маса, вартість, діапазон ризику, заповненість ракети),
            priorities (Factor[]). Невідомі ключі дозволені.
          additionalProperties: true
          minProperties: 1
        language: {type: string, enum: [uk, en], default: uk}
        audience:
          type: string
          enum: [planner, public]
          default: planner
          description: planner — стисло, з числами; public — простою мовою без жаргону
        question:
          type: [string, "null"]
          maxLength: 500
          description: Необов'язкове питання користувача до результатів

    AdviceTip:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string}
        related_metric: {type: string, description: "Поле з facts, на яке спирається порада, напр. mission.mass_leo_kg"}

    AdviceResponse:
      type: object
      required: [summary, tips, caveats, model, generated_utc, verified]
      additionalProperties: false
      properties:
        summary: {type: string}
        tips:
          type: array
          items: {$ref: "#/components/schemas/AdviceTip"}
        caveats:
          type: array
          items: {type: string}
        model: {type: string, description: Назва моделі, що згенерувала відповідь}
        generated_utc: {type: string, format: date-time}
        verified:
          type: boolean
          description: Усі числа у відповіді знайдено у facts. false — відповідь неперевірена, фронтенд показує попередження.

    RankFactor:
      type: string
      enum: [energy, comms, radiation, temperature]
      description: Фактори, які вміє оцінювати /rank (cost, risk, flight_time — з'являться з моделлю місії)

    RankPointInput:
      type: object
      additionalProperties: false
      description: Точка — або `site_id` з каталогу, або `lat` і `lon`
      properties:
        site_id: {type: string}
        lat: {type: number, minimum: -90, maximum: 90}
        lon: {type: number, minimum: -180, maximum: 360}
        name: {type: string}

    RankRequest:
      type: object
      required: [points, start, end]
      additionalProperties: false
      properties:
        points:
          type: array
          minItems: 2
          maxItems: 30
          items: {$ref: "#/components/schemas/RankPointInput"}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        step_h: {type: number, minimum: 0.1, maximum: 24, default: 1}
        height_m: {type: number, minimum: 0, maximum: 1000, default: 0}
        priorities:
          type: array
          description: Від найважливішого; порядок задає ваги ROC. За замовчуванням [energy, comms].
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/RankFactor"}
        mode: {type: string, enum: [weighted, maximin], default: weighted}
        requirements:
          type: object
          additionalProperties: false
          properties:
            min_sun_hours: {type: number, minimum: 0}
            min_comm_hours: {type: number, minimum: 0}
        params:
          type: object
          additionalProperties: false
          description: Перевизначення опорних шкал (MATH.md, §19.2)
          properties:
            night_ref_h: {type: number, exclusiveMinimum: 0, default: 354}
            comm_gap_ref_h: {type: number, exclusiveMinimum: 0, default: 336}
            energy_sun_weight: {type: number, minimum: 0, maximum: 1, default: 0.6}
            comms_time_weight: {type: number, minimum: 0, maximum: 1, default: 0.7}
            shield_ref: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.4}
            temp_min_k: {type: number, default: 233.15}
            temp_max_k: {type: number, default: 333.15}

    RankViolation:
      type: object
      required: [requirement, value, required]
      properties:
        requirement: {type: string, enum: [min_sun_hours, min_comm_hours]}
        value: {type: number}
        required: {type: number}

    RankSummary:
      type: object
      description: Підсумки за період (як PeriodSummary) і додаткові показники точки
      required: [sun_hours, comm_hours, sun_fraction, comm_fraction, longest_night_h, longest_comm_gap_h, energy_wh_per_m2]
      properties:
        sun_hours: {type: number}
        comm_hours: {type: number}
        sun_fraction: {type: number, minimum: 0, maximum: 1}
        comm_fraction: {type: number, minimum: 0, maximum: 1}
        longest_night_h: {type: number}
        longest_comm_gap_h: {type: number}
        energy_wh_per_m2: {type: number}
        sky_view_fraction: {type: number, description: Частка відкритого неба (доза ГКП ∝ ця частка)}
        thermal_fraction: {type: [number, "null"], description: Частка місячної доби з температурою поверхні в діапазоні; лише якщо запитано temperature}

    RankedPoint:
      type: object
      required: [rank, point, feasible, violations, score_pct, pareto, factors, summary, horizon_source]
      properties:
        rank: {type: integer, minimum: 1}
        point:
          type: object
          required: [lat, lon]
          properties:
            site_id: {type: [string, "null"]}
            name: {type: [string, "null"]}
            lat: {type: number}
            lon: {type: number}
        feasible: {type: boolean}
        violations:
          type: array
          items: {$ref: "#/components/schemas/RankViolation"}
        score_pct: {type: number, minimum: 0, maximum: 100}
        pareto: {type: boolean, description: Недомінований серед допустимих точок}
        factors:
          type: object
          description: Оцінки 0..1 за кожним фактором із priorities
          additionalProperties: {type: number, minimum: 0, maximum: 1}
        summary: {$ref: "#/components/schemas/RankSummary"}
        horizon_source: {type: string, description: "flat або id DEM, з якого збудовано маску горизонту"}

    RankFactorComparison:
      type: object
      required: [factor, a, b, delta, winner]
      properties:
        factor: {$ref: "#/components/schemas/RankFactor"}
        a: {type: number}
        b: {type: number}
        delta: {type: number, description: a − b}
        winner: {type: string, enum: [a, b, tie]}

    RankComparison:
      type: object
      description: Порівняння точок a і b (за замовчуванням — найкраща проти другої)
      required: [a_rank, b_rank, score_delta_pct, dominance, per_factor, decisive_factor, weighted_advantage]
      properties:
        a_rank: {type: integer}
        b_rank: {type: integer}
        score_delta_pct: {type: number}
        dominance:
          type: string
          enum: [a, b, tradeoff, tie]
          description: a/b — одна точка не гірша за всіма факторами й краща хоча б за одним; tradeoff — виграш за одними факторами коштує програшу за іншими
        per_factor: {type: array, items: {$ref: "#/components/schemas/RankFactorComparison"}}
        decisive_factor: {type: [string, "null"], description: Фактор з найбільшим внеском у різницю (вага × різниця)}
        weighted_advantage: {type: number, description: "Σ вага·(a − b); > 0 — перевага a"}

    RankResponse:
      type: object
      required: [period, mode, priorities, weights, params, ranking, comparison]
      properties:
        period:
          type: object
          required: [start, end, period_h, step_h]
          properties:
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
            period_h: {type: number}
            step_h: {type: number}
        mode: {type: string, enum: [weighted, maximin]}
        priorities: {type: array, items: {$ref: "#/components/schemas/RankFactor"}}
        weights:
          type: object
          additionalProperties: {type: number}
        params:
          type: object
          additionalProperties: {type: number}
        ranking:
          type: array
          items: {$ref: "#/components/schemas/RankedPoint"}
        comparison:
          oneOf:
            - {$ref: "#/components/schemas/RankComparison"}
            - {type: "null"}
