name: CI

# Перевірки на кожен pull request і на кожне злиття в main.
# Тести, що потребують завантажених даних NASA (DEM, Diviner), у CI пропускаються — їх немає в репозиторії.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Node потрібен JS-тестам фронтенду (tests/js/*.mjs): без нього обгортка pytest їх пропускає
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Залежності (включно з ефемеридами DE440, ~114 МБ)
        run: pip install -r requirements-dev.txt

      - name: Лінтер
        run: ruff check .

      - name: Тести Python і JS
        run: python -m pytest -q -rs

  # Образ збирається й відповідає на /api/meta: Dockerfile не розходиться з кодом (I3). Нічого не публікується.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Збірка образу
        run: docker build -t lunar-mission-builder .

      - name: Запуск і перевірка живості
        run: |
          docker run -d --name lmb -p 8000:8000 -e LSE_AUTO_PREPARE=0 lunar-mission-builder
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/meta >/dev/null; then echo "ok"; exit 0; fi
            sleep 2
          done
          docker logs lmb
          exit 1
